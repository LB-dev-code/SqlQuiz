<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - MySQL Knowledge Test Platform</title>
    <style>
        :root{
            /* Color tokens tuned for dark, high-contrast UI */
            --bg: #0b0f14;               /* page background */
            --bg-grad-1: #0b0f14;
            --bg-grad-2: #0e1219;
            --panel: rgba(18, 22, 29, 0.55);   /* glass panel base */
            --panel-strong: rgba(18, 22, 29, 0.75);
            --white: #e8edf7;
            --muted: #9aa6b2;
            --field: rgba(255,255,255,0.06);
            --field-border: rgba(255,255,255,0.12);
            --field-focus: rgba(100, 180, 255, 0.25);
            --accent-1: #6e74ff;         /* gradient start */
            --accent-2: #6ce1ff;         /* gradient end */
            --danger: #ff5f8a;
            --success: #4ff0a7;
            --shadow-1: rgba(0, 0, 0, 0.35);
            --shadow-2: rgba(0, 20, 60, 0.35);
            --heart: #ff6aa2;
        }

        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            background: linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2));
            margin: 0; padding: 0;
            font-family: Inter, Poppins, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--white);
        }

        /* Center container */
        .wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* subtle background glow elements (no images) for glass feel */
        .glow {
            position: absolute;
            filter: blur(90px);
            opacity: 0.35;
            pointer-events: none;
        }
        .glow.g1 {
            width: 420px; height: 420px; border-radius: 50%;
            background: radial-gradient(closest-side, rgba(110,116,255,0.5), transparent);
            top: 10%; left: 12%;
        }
        .glow.g2 {
            width: 520px; height: 520px; border-radius: 50%;
            background: radial-gradient(closest-side, rgba(108,225,255,0.45), transparent);
            bottom: 8%; right: 10%;
        }

        /* Glass panel */
        .card {
            width: 560px;
            max-width: 92vw;
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow:
                0 18px 50px var(--shadow-1),
                inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: saturate(140%) blur(14px);
            -webkit-backdrop-filter: saturate(140%) blur(14px);
            border-radius: 20px;
            padding: 28px 28px 22px;
        }

        /* Heading */
        .title {
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 0.2px;
            margin: 2px 0 18px;
            color: var(--white);
        }

        /* Form layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }

        .input {
            width: 100%;
            height: 44px;
            background: var(--field);
            border: 1px solid var(--field-border);
            color: var(--white);
            font-size: 14px;
            border-radius: 12px;
            padding: 0 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-sizing: border-box;
        }
        .input::placeholder {
            color: rgba(232,237,247,0.35);
        }
        .input:focus {
            border-color: rgba(130, 200, 255, 0.65);
            box-shadow: 0 0 0 4px var(--field-focus);
            background: rgba(255,255,255,0.08);
        }

        /* Password inputs side-by-side on wide screens */
        @media (min-width: 600px){
            .row-2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
        }

        /* Role selector */
        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 4px;
        }
        .role {
            position: relative;
            background: var(--panel-strong);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 14px;
            min-height: 86px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .role:hover {
            transform: translateY(-1px);
            border-color: rgba(255,255,255,0.16);
            box-shadow: 0 10px 20px var(--shadow-2);
            background: rgba(20, 24, 31, 0.78);
        }
        .role.active {
            border-color: rgba(108,225,255,0.55);
            box-shadow: 0 0 0 4px rgba(108,225,255,0.22);
        }

        .role-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .role-icon {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(110,116,255,0.35), rgba(108,225,255,0.25));
            display: grid; place-items: center;
            color: var(--white);
            font-size: 16px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.3);
        }
        .role-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.2px;
            color: var(--white);
        }
        .role-desc {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.2px;
            line-height: 1.35;
        }

        /* Heart tag near Student */
        .heart {
            position: absolute;
            top: 10px; right: 12px;
            font-size: 16px;
            color: var(--heart);
            filter: drop-shadow(0 1px 4px rgba(255, 106, 162, 0.35));
            user-select: none;
        }

        /* Register button */
        .btn {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.2px;
            color: #0b0f14;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            box-shadow:
                0 14px 28px rgba(108,225,255,0.18),
                0 4px 10px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.45);
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.12s ease, filter 0.12s ease;
            margin-top: 6px;
        }
        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.04);
            box-shadow:
                0 16px 32px rgba(108,225,255,0.22),
                0 6px 14px rgba(0,0,0,0.45);
        }
        .btn:active {
            transform: translateY(0);
            filter: brightness(0.98);
        }

        /* Login link */
        .login {
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }
        .login a {
            color: var(--white);
            text-decoration: none;
            border-bottom: 1px dashed rgba(255,255,255,0.25);
            padding-bottom: 1px;
            transition: color 0.2s ease, border-bottom-color 0.2s ease;
        }
        .login a:hover {
            color: #cfe8ff;
            border-bottom-color: rgba(255,255,255,0.45);
        }

        /* Alert styling for template consistency */
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 13px;
            border: 1px solid;
        }
        
        .alert-danger {
            background: rgba(255, 95, 138, 0.1);
            border-color: var(--danger);
            color: var(--danger);
        }
        
        .alert-success {
            background: rgba(79, 240, 167, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        /* Fine alignments to mimic tight spacing and visual hierarchy */
        .spacer-4 { height: 4px; }
        .spacer-8 { height: 8px; }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .card {
                width: 95vw;
                padding: 20px;
            }
            .roles {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="glow g1"></div>
        <div class="glow g2"></div>

        <section class="card" aria-label="Register form">
            <div class="title">User Registration</div>

            <!-- Error Message -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}">Registration Failed</span>
            </div>

            <!-- Success Message -->
            <div th:if="${message}" class="alert alert-success" role="alert">
                <span th:text="${message}">Operation Successful</span>
            </div>

            <form class="form-grid" th:action="@{/register}" method="post" id="registerForm" autocomplete="off">
                <!-- Username -->
                <div>
                    <div class="label">Username *</div>
                    <input class="input" type="text" placeholder="Please enter username (3-50 characters)" name="username" 
                           required minlength="3" maxlength="50" />
                </div>

                <!-- Full name -->
                <div>
                    <div class="label">Full Name *</div>
                    <input class="input" type="text" placeholder="Please enter your full name" name="fullName" 
                           required />
                </div>

                <!-- Email -->
                <div>
                    <div class="label">Email Address *</div>
                    <input class="input" type="email" placeholder="Please enter your email address" name="email" 
                           required />
                </div>

                <!-- Password + Confirm password -->
                <div class="row-2">
                    <div>
                        <div class="label">Password *</div>
                        <input class="input" type="password" placeholder="Please enter password (at least 6 characters)" 
                               name="password" id="password" required minlength="6" />
                    </div>
                    <div>
                        <div class="label">Confirm Password *</div>
                        <input class="input" type="password" placeholder="Please enter password again" 
                               name="confirmPassword" id="confirmPassword" required />
                    </div>
                </div>

                <!-- Roles -->
                <div class="spacer-4"></div>
                <div class="roles" role="radiogroup" aria-label="Select Role">
                    <!-- Teacher -->
                    <div class="role" tabindex="0" data-role="teacher" aria-checked="false" role="radio">
                        <div class="role-head">
                            <div class="role-icon" aria-hidden="true">👤</div>
                            <div class="role-title">Teacher</div>
                        </div>
                        <div class="role-desc">Create and manage tests</div>
                        <input type="radio" name="role" value="teacher" id="roleTeacher" style="display:none;">
                    </div>

                    <!-- Student (with heart) -->
                    <div class="role" tabindex="0" data-role="student" aria-checked="false" role="radio">
                        <div class="heart" aria-hidden="true">❤</div>
                        <div class="role-head">
                            <div class="role-icon" aria-hidden="true">🎓</div>
                            <div class="role-title">Student</div>
                        </div>
                        <div class="role-desc">Take tests and practice</div>
                        <input type="radio" name="role" value="student" id="roleStudent" style="display:none;">
                    </div>
                </div>

                <!-- Register button -->
                <button class="btn" type="submit">Register Account</button>

                <!-- Login link -->
                <div class="login">
                    <a href="/login">Already have an account? Login Now</a>
                </div>
            </form>
        </section>
    </div>

    <script>
        // Minimal script to toggle role selection state
        (function(){
            const roles = document.querySelectorAll('.role');
            roles.forEach(r => {
                const select = () => {
                    roles.forEach(x => {
                        x.classList.remove('active');
                        x.setAttribute('aria-checked', 'false');
                    });
                    r.classList.add('active');
                    r.setAttribute('aria-checked', 'true');
                    
                    // Set the corresponding radio button
                    const radio = r.querySelector('input[type="radio"]');
                    if (radio) radio.checked = true;
                };
                r.addEventListener('click', select);
                r.addEventListener('keydown', (e) => {
                    if(e.key === 'Enter' || e.key === ' ') { 
                        e.preventDefault(); 
                        select(); 
                    }
                });
            });

            // Form validation
            document.getElementById('registerForm').addEventListener('submit', function(e) {
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const role = document.querySelector('input[name="role"]:checked');
                
                if (password !== confirmPassword) {
                    e.preventDefault();
                    alert('Password entries do not match!');
                    return;
                }
                
                if (!role) {
                    e.preventDefault();
                    alert('Please select a user role!');
                    return;
                }
            });
        })();
    </script>
</body>
</html>
