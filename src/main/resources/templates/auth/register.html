<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - SQL Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* AuthKit-inspired Light Mode */
            --background-primary: #FFFFFF;
            --background-secondary: #F9FAFB;
            --background-tertiary: #F4F4F5;
            --text-primary: #18181B;
            --text-secondary: #71717A;
            --text-tertiary: #A1A1AA;
            --border-default: #E4E4E7;
            --border-hover: #D4D4D8;
            --accent-primary: #18181B;
            --accent-hover: #27272A;
            --link-color: #2563EB;
            --link-hover: #1D4ED8;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-2xl: 24px;
        }

        /* Dark Mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --background-primary: #09090B;
                --background-secondary: #18181B;
                --background-tertiary: #27272A;
                --text-primary: #FAFAFA;
                --text-secondary: #A1A1AA;
                --text-tertiary: #71717A;
                --border-default: #27272A;
                --border-hover: #3F3F46;
                --accent-primary: #FAFAFA;
                --accent-hover: #E4E4E7;
                --link-color: #3B82F6;
                --link-hover: #60A5FA;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background-secondary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Animated background gradient */
        .bg-gradient {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, var(--background-secondary) 0%, var(--background-tertiary) 100%);
            z-index: -1;
        }

        .bg-gradient::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
            animation: gradientShift 15s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* Main card container */
        .register-card {
            width: 100%;
            max-width: 460px;
            background: var(--background-primary);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-xl);
            padding: 40px;
            animation: cardFadeIn 0.5s ease-out;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo section */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .logo svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .logo-title {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .logo-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Form styles */
        .form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            height: 42px;
            padding: 0 14px;
            background: var(--background-secondary);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .form-input:hover {
            border-color: var(--border-hover);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            .form-input:focus {
                box-shadow: 0 0 0 3px rgba(250, 250, 250, 0.08);
            }
        }

        /* Password row */
        .password-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Role selection cards */
        .role-section {
            margin-top: 8px;
        }

        .role-section-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .role-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .role-card {
            position: relative;
            padding: 16px;
            background: var(--background-secondary);
            border: 2px solid var(--border-default);
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .role-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .role-card.active {
            border-color: var(--accent-primary);
            background: var(--background-tertiary);
        }

        .role-card.active .role-icon {
            background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
        }

        .role-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 10px;
            background: var(--background-tertiary);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .role-icon svg {
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
        }

        .role-card.active .role-icon svg {
            color: white;
        }

        .role-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .role-desc {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .role-heart {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .role-card.student .role-heart {
            opacity: 1;
        }

        /* Submit button */
        .btn-submit {
            height: 46px;
            margin-top: 8px;
            background: var(--accent-primary);
            border: none;
            border-radius: var(--radius-lg);
            color: var(--background-primary);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .btn-submit.loading {
            pointer-events: none;
            position: relative;
        }

        .btn-submit.loading .btn-text {
            visibility: hidden;
        }

        .btn-submit.loading::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2px solid var(--background-primary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 8px 0;
            color: var(--text-tertiary);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-default);
        }

        .divider span {
            padding: 0 12px;
        }

        /* Login link */
        .login-link {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .login-link a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Alert messages */
        .alert {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            font-size: 14px;
            animation: alertFadeIn 0.3s ease-out;
        }

        @keyframes alertFadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .alert-error {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.2);
            color: #EF4444;
        }

        .alert-error svg {
            color: #EF4444;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #22C55E;
        }

        .alert-success svg {
            color: #22C55E;
        }

        /* Footer */
        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            margin: 0 12px;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--text-primary);
        }

        /* Responsive */
        @media (max-width: 500px) {
            .register-card {
                padding: 24px 20px;
            }

            .password-row {
                grid-template-columns: 1fr;
            }

            .role-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="register-card">
        <!-- Logo section -->
        <div class="logo-section">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                    <path d="M12 6v6l4 2"/>
                    <path d="M8 12h8"/>
                </svg>
            </div>
            <h1 class="logo-title">创建账户</h1>
            <p class="logo-subtitle">加入 SQL Quiz，开始你的学习之旅</p>
        </div>

        <!-- Error/Success messages -->
        <div th:if="${error}" class="alert alert-error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span th:text="${error}">注册失败</span>
        </div>

        <div th:if="${message}" class="alert alert-success">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${message}">操作成功</span>
        </div>

        <!-- Register form -->
        <form th:action="@{/register}" method="post" class="form" id="registerForm">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input type="text" id="username" name="username" class="form-input"
                       placeholder="3-50个字符" required minlength="3" maxlength="50" autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="fullName">姓名</label>
                <input type="text" id="fullName" name="fullName" class="form-input"
                       placeholder="请输入您的姓名" required autocomplete="name">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">邮箱地址</label>
                <input type="email" id="email" name="email" class="form-input"
                       placeholder="请输入邮箱" required autocomplete="email">
            </div>

            <div class="password-row">
                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="至少6个字符" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                           placeholder="再次输入密码" required autocomplete="new-password">
                </div>
            </div>

            <!-- Role selection -->
            <div class="role-section">
                <div class="role-section-title">选择角色</div>
                <div class="role-cards">
                    <!-- Teacher -->
                    <div class="role-card teacher" tabindex="0" data-role="teacher">
                        <div class="role-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </div>
                        <div class="role-title">教师</div>
                        <div class="role-desc">创建和管理测验</div>
                        <input type="radio" name="role" value="teacher" style="display:none;">
                    </div>

                    <!-- Student -->
                    <div class="role-card student" tabindex="0" data-role="student">
                        <span class="role-heart">❤</span>
                        <div class="role-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                                <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                            </svg>
                        </div>
                        <div class="role-title">学生</div>
                        <div class="role-desc">参加测验和练习</div>
                        <input type="radio" name="role" value="student" style="display:none;">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">注册账户</span>
            </button>
        </form>

        <div class="divider">
            <span>或</span>
        </div>

        <p class="login-link">
            已有账户？ <a href="/login">立即登录</a>
        </p>

        <!-- Footer -->
        <footer class="footer">
            <a href="#">关于平台</a>
            <a href="#">使用帮助</a>
            <a href="#">联系我们</a>
        </footer>
    </div>

    <script>
        // Role selection
        const roleCards = document.querySelectorAll('.role-card');

        roleCards.forEach(card => {
            const select = () => {
                roleCards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');

                const radio = card.querySelector('input[type="radio"]');
                if (radio) radio.checked = true;
            };

            card.addEventListener('click', select);

            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    select();
                }
            });
        });

        // Form validation
        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');

        registerForm.addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.querySelector('input[name="role"]:checked');

            if (password !== confirmPassword) {
                e.preventDefault();
                alert('两次输入的密码不一致！');
                return;
            }

            if (!role) {
                e.preventDefault();
                alert('请选择用户角色！');
                return;
            }

            submitBtn.classList.add('loading');
        });
    </script>
</body>
</html>
