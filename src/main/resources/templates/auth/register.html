<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Creation / Berlin Concrete</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            /* Berlin Concrete Palette */
            --bg-concrete: #141414;
            --surface-raw: rgba(255, 255, 255, 0.03);
            --glass-smoke: rgba(10, 10, 10, 0.6);
            --border-steel: rgba(255, 255, 255, 0.15);

            /* Accents */
            --signal-orange: #ff3c00;
            --blueprint-blue: #0044ff;
            --success-green: #00ff66;
            --alert-red: #ff003c;

            /* Typography */
            --font-display: 'Space Grotesk', sans-serif;
            --font-tech: 'IBM Plex Mono', monospace;
            --space-unit: 1.5rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-concrete);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            color: #e0e0e0;
            font-family: var(--font-tech);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Glass Panel */
        .glass-panel {
            background: var(--surface-raw);
            backdrop-filter: blur(20px) grayscale(100%);
            -webkit-backdrop-filter: blur(20px) grayscale(100%);

            /* Caustic Edge */
            box-shadow:
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 0 rgba(0, 0, 0, 0.5),
                0 24px 48px -12px rgba(0, 0, 0, 0.5);

            border: 1px solid var(--border-steel);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(0, 0, 0, 0.5);
            border-radius: 0;

            width: 100%;
            max-width: 600px;
            /* Wider for register */
            padding: 3rem;
            position: relative;
            margin: 1rem;
        }

        /* Typography */
        h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .meta-text {
            font-family: var(--font-tech);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.6;
            margin-bottom: 2rem;
            display: block;
        }

        /* Form Elements */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-family: var(--font-tech);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            color: #888;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-steel);
            color: #fff;
            padding: 1rem;
            font-family: var(--font-tech);
            font-size: 1rem;
            transition: all 0.2s;
            border-radius: 0;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--signal-orange);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 60, 0, 0.1);
        }

        /* Role Selection - Industrial Cards */
        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .role-card {
            background: var(--surface-raw);
            border: 1px solid var(--border-steel);
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .role-card:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .role-card.active {
            border-color: var(--signal-orange);
            background: rgba(255, 60, 0, 0.05);
        }

        .role-card.active::before {
            content: 'SELECTED';
            position: absolute;
            top: 0;
            right: 0;
            background: var(--signal-orange);
            color: #000;
            font-size: 0.6rem;
            padding: 2px 6px;
            font-weight: 700;
        }

        .role-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #888;
        }

        .role-card.active .role-icon {
            color: var(--signal-orange);
        }

        .role-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 0.25rem;
        }

        .role-desc {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
        }

        .btn-submit {
            display: inline-block;
            width: 100%;
            background: var(--signal-orange);
            color: #000;
            padding: 1rem;
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            border-radius: 0;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-send-code {
            background: transparent;
            border: 1px solid var(--blueprint-blue);
            color: var(--blueprint-blue);
            padding: 1rem;
            font-family: var(--font-tech);
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            min-width: 110px;
        }

        .btn-send-code:hover:not(:disabled) {
            background: var(--blueprint-blue);
            color: #fff;
        }

        .btn-send-code:disabled {
            border-color: #666;
            color: #666;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .alert-error {
            border-color: var(--alert-red);
            color: var(--alert-red);
            background: rgba(255, 0, 60, 0.05);
        }

        .alert-success {
            border-color: var(--success-green);
            color: var(--success-green);
            background: rgba(0, 255, 102, 0.05);
        }

        .links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .links a {
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }

        .links a:hover {
            color: var(--signal-orange);
        }

        /* Layout Asymmetry Element */
        .deco-strip {
            position: absolute;
            top: 0;
            left: -20px;
            bottom: 0;
            width: 10px;
            background: repeating-linear-gradient(45deg,
                    var(--border-steel),
                    var(--border-steel) 1px,
                    transparent 1px,
                    transparent 10px);
            opacity: 0.3;
        }
    </style>
</head>

<body>

    <div class="glass-panel">
        <div class="deco-strip"></div>

        <header>
            <h1>New Identity</h1>
            <span class="meta-text">Register Protocol v2.5 // Assign Role</span>
        </header>

        <!-- Messages -->
        <div th:if="${error}" class="alert alert-error">
            <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}">Error</span>
        </div>
        <div th:if="${message}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${message}">Success</span>
        </div>

        <form th:action="@{/register}" method="post" id="registerForm">

            <div class="form-group">
                <label for="username">Username Handle</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="UNIQUE IDENTIFIER"
                    required minlength="3" maxlength="50" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="fullName">Display Name</label>
                <input type="text" id="fullName" name="fullName" class="form-control" placeholder="FULL NAME" required
                    autocomplete="name">
            </div>

            <div class="form-group">
                <label for="email">Comms Address</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="email" id="email" name="email" class="form-control" placeholder="EMAIL ADDRESS" required
                        autocomplete="email">
                    <button type="button" class="btn-send-code" onclick="sendVerificationCode()" id="sendCodeBtn">
                        Send Code
                    </button>
                </div>
                <small id="emailHelp" style="color: #666; font-size: 0.7rem; margin-top: 0.3rem; display: block;"></small>
            </div>

            <div class="form-group">
                <label for="verificationCode">Verification Code</label>
                <input type="text" id="verificationCode" name="verificationCode" class="form-control"
                    placeholder="ENTER CODE" required maxlength="6" pattern="[0-9]{6}">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="SECRET"
                        required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                        placeholder="REPEAT" required autocomplete="new-password">
                </div>
            </div>

            <!-- Role Selection -->
            <label style="margin-bottom: 0.5rem; display:block;">Assign Designation</label>
            <div class="role-grid">
                <!-- Teacher -->
                <div class="role-card" onclick="selectRole('teacher', this)">
                    <div class="role-icon"><i class="fas fa-chalkboard-teacher"></i></div>
                    <div class="role-title">TEACHER</div>
                    <div class="role-desc">Administer & Control</div>
                    <input type="radio" name="role" value="teacher" style="display:none;">
                </div>

                <!-- Student -->
                <div class="role-card" onclick="selectRole('student', this)">
                    <div class="role-icon"><i class="fas fa-user-graduate"></i></div>
                    <div class="role-title">STUDENT</div>
                    <div class="role-desc">Execute Protocols</div>
                    <input type="radio" name="role" value="student" style="display:none;">
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Confirm Registration
            </button>
        </form>

        <div class="links">
            <span>Already Assigned?</span> <a th:href="@{/login}">Access Terminal</a>
        </div>
    </div>

    <script>
        // 倒计时相关变量
        let countdown = 0;
        let countdownInterval = null;

        // 发送验证码
        async function sendVerificationCode() {
            const emailInput = document.getElementById('email');
            const sendCodeBtn = document.getElementById('sendCodeBtn');
            const emailHelp = document.getElementById('emailHelp');

            const email = emailInput.value.trim();
            console.log('[Send Code] 准备发送验证码到:', email);

            // 验证邮箱格式
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                console.error('[Send Code] 邮箱格式无效');
                emailHelp.textContent = 'ERROR: INVALID EMAIL FORMAT';
                emailHelp.style.color = 'var(--alert-red)';
                return;
            }

            // 禁用按钮
            sendCodeBtn.disabled = true;
            emailHelp.textContent = 'SENDING...';
            emailHelp.style.color = '#888';

            try {
                console.log('[Send Code] 开始发送请求...');
                const response = await fetch('/send-verification-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: 'email=' + encodeURIComponent(email)
                });

                console.log('[Send Code] 响应状态:', response.status);
                const result = await response.json();
                console.log('[Send Code] 响应结果:', result);

                if (result.success) {
                    emailHelp.textContent = 'CODE SENT! CHECK YOUR EMAIL';
                    emailHelp.style.color = 'var(--success-green)';
                    startCountdown();
                } else {
                    console.error('[Send Code] 发送失败:', result.message);
                    emailHelp.textContent = 'ERROR: ' + result.message;
                    emailHelp.style.color = 'var(--alert-red)';
                    sendCodeBtn.disabled = false;
                }
            } catch (error) {
                console.error('[Send Code] 请求异常:', error);
                emailHelp.textContent = 'ERROR: FAILED TO SEND CODE';
                emailHelp.style.color = 'var(--alert-red)';
                sendCodeBtn.disabled = false;
            }
        }

        // 开始倒计时
        function startCountdown() {
            const sendCodeBtn = document.getElementById('sendCodeBtn');
            countdown = 60; // 60秒倒计时

            countdownInterval = setInterval(() => {
                sendCodeBtn.textContent = 'WAIT ' + countdown + 'S';

                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                    sendCodeBtn.textContent = 'Send Code';
                    sendCodeBtn.disabled = false;
                }
                countdown--;
            }, 1000);
        }

        function selectRole(role, cardElement) {
            // Remove active from all
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
            // Add active to clicked
            cardElement.classList.add('active');
            // Check the radio
            cardElement.querySelector('input').checked = true;
        }

        const registerForm = document.getElementById('registerForm');
        registerForm.addEventListener('submit', function (e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.querySelector('input[name="role"]:checked');
            const verificationCode = document.getElementById('verificationCode').value;

            if (password !== confirmPassword) {
                e.preventDefault();
                alert('ERROR: PASSWORDS DO NOT MATCH');
                return;
            }

            if (!role) {
                e.preventDefault();
                alert('ERROR: DESIGNATION REQUIRED');
                return;
            }

            if (!verificationCode || verificationCode.length !== 6) {
                e.preventDefault();
                alert('ERROR: VALID VERIFICATION CODE REQUIRED');
                return;
            }
        });
    </script>
</body>

</html>
