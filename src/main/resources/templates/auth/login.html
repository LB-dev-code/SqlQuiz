<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access / Berlin Concrete</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            /* Berlin Concrete Palette */
            --bg-concrete: #141414;
            --surface-raw: rgba(255, 255, 255, 0.03);
            --glass-smoke: rgba(10, 10, 10, 0.6);
            --border-steel: rgba(255, 255, 255, 0.15);

            /* Accents */
            --signal-orange: #ff3c00;
            --blueprint-blue: #0044ff;
            --success-green: #00ff66;
            --alert-red: #ff003c;

            /* Typography */
            --font-display: 'Space Grotesk', sans-serif;
            --font-tech: 'IBM Plex Mono', monospace;
            --space-unit: 1.5rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-concrete);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            color: #e0e0e0;
            font-family: var(--font-tech);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Glass Panel */
        .glass-panel {
            background: var(--surface-raw);
            backdrop-filter: blur(20px) grayscale(100%);
            -webkit-backdrop-filter: blur(20px) grayscale(100%);

            /* Caustic Edge */
            box-shadow:
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 0 rgba(0, 0, 0, 0.5),
                0 24px 48px -12px rgba(0, 0, 0, 0.5);

            border: 1px solid var(--border-steel);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(0, 0, 0, 0.5);
            border-radius: 0;

            width: 100%;
            max-width: 480px;
            padding: 3rem;
            position: relative;
            margin: 1rem;
        }

        /* Typography */
        h1 {
            font-family: var(--font-display);
            font-size: 3rem;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .meta-text {
            font-family: var(--font-tech);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.6;
            margin-bottom: 2rem;
            display: block;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-family: var(--font-tech);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            color: #888;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-steel);
            color: #fff;
            padding: 1rem;
            font-family: var(--font-tech);
            font-size: 1rem;
            transition: all 0.2s;
            border-radius: 0;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--signal-orange);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 60, 0, 0.1);
        }

        .btn-submit {
            display: inline-block;
            width: 100%;
            background: var(--signal-orange);
            color: #000;
            padding: 1rem;
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            border-radius: 0;
            margin-top: 1rem;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* Quick Login Grid */
        .quick-access-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border-steel);
            padding-top: 2rem;
        }

        .quick-btn {
            background: var(--surface-raw);
            border: 1px solid var(--border-steel);
            color: #aaa;
            padding: 0.75rem;
            text-align: left;
            font-family: var(--font-tech);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .quick-btn:hover {
            border-color: #fff;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .quick-role {
            text-transform: uppercase;
            font-weight: 700;
            color: var(--blueprint-blue);
        }

        .alert {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .alert-error {
            border-color: var(--alert-red);
            color: var(--alert-red);
            background: rgba(255, 0, 60, 0.05);
        }

        .alert-success {
            border-color: var(--success-green);
            color: var(--success-green);
            background: rgba(0, 255, 102, 0.05);
        }

        .links {
            margin-top: 1.5rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .links a {
            color: #666;
            text-decoration: none;
            transition: color 0.2s;
        }

        .links a:hover {
            color: var(--signal-orange);
        }

        /* Layout Asymmetry Element */
        .deco-strip {
            position: absolute;
            top: 0;
            left: -20px;
            bottom: 0;
            width: 10px;
            background: repeating-linear-gradient(45deg,
                    var(--border-steel),
                    var(--border-steel) 1px,
                    transparent 1px,
                    transparent 10px);
            opacity: 0.3;
        }

        /* Checkbox styling */
        .check-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: -0.5rem;
            margin-bottom: 1.5rem;
        }

        .check-group input {
            accent-color: var(--signal-orange);
            width: 16px;
            height: 16px;
        }

        .check-group label {
            margin-bottom: 0;
            color: #888;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="glass-panel">
        <div class="deco-strip"></div>

        <header>
            <h1>System Entry</h1>
            <span class="meta-text">Access Protocol v2.5 // Auth Required</span>
        </header>

        <!-- Messages -->
        <div th:if="${param.error}" class="alert alert-error">
            <i class="fas fa-exclamation-triangle"></i> Access Denied: Invalid Credentials
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> Session Terminated Successfully
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">User Identity</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="ENTER USERNAME"
                    required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Access Key</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="ENTER PASSWORD"
                    required autocomplete="current-password">
            </div>

            <div class="check-group">
                <input type="checkbox" id="remember-me" name="remember-me">
                <label for="remember-me">Retain Session</label>
            </div>

            <button type="submit" class="btn-submit">
                Initialize Session
            </button>
        </form>

        <div class="links">
            <a th:href="@{/register}">Create New Identity</a>
        </div>

    </div>

</body>

</html>
