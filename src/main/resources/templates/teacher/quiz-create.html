<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Create / Berlin Concrete</title>

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-concrete: #141414;
            --surface-raw: rgba(255, 255, 255, 0.03);
            --glass-smoke: rgba(10, 10, 10, 0.6);
            --border-steel: rgba(255, 255, 255, 0.15);
            --signal-orange: #ff3c00;
            --blueprint-blue: #0044ff;
            --success-green: #00ff66;
            --alert-red: #ff003c;
            --font-display: 'Space Grotesk', sans-serif;
            --font-tech: 'IBM Plex Mono', monospace;
            --space-unit: 1.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-concrete);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            color: #e0e0e0;
            font-family: var(--font-tech);
            line-height: 1.5;
            min-height: 100vh;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--glass-smoke);
            backdrop-filter: blur(20px) grayscale(100%);
            border-right: 1px solid var(--border-steel);
            padding: var(--space-unit);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand-block h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .brand-meta {
            font-size: 0.7rem;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-top: 3rem;
            flex: 1;
        }

        .nav-item {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #888;
            text-decoration: none;
            position: relative;
            display: flex;
            gap: 10px;
            align-items: center;
            transition: all 0.2s;
        }

        .nav-item:hover,
        .nav-item.active {
            color: #fff;
            padding-left: 10px;
        }

        .nav-item.active::before {
            content: '→';
            position: absolute;
            left: -15px;
            color: var(--signal-orange);
        }

        .user-profile {
            padding-top: 1rem;
            border-top: 1px solid var(--border-steel);
            font-size: 0.8rem;
            color: #666;
        }

        .user-name {
            color: #fff;
            display: block;
            margin-bottom: 4px;
        }

        .logout-link {
            color: var(--alert-red);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.7rem;
        }

        .main-content {
            padding: 0;
        }

        .top-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-steel);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .page-title h2 {
            font-family: var(--font-display);
            font-size: 3rem;
            line-height: 0.9;
            text-transform: uppercase;
        }

        .page-subtitle {
            color: var(--blueprint-blue);
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }

        /* FORM */
        .form-container {
            padding: 2rem;
            max-width: 800px;
        }

        .panel {
            background: var(--surface-raw);
            border: 1px solid var(--border-steel);
            padding: 2rem;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .panel-header {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-steel);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-header i {
            color: var(--signal-orange);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .form-control,
        .select-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-steel);
            color: #fff;
            padding: 1rem;
            font-family: var(--font-tech);
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--blueprint-blue);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 2px rgba(0, 68, 255, 0.1);
        }

        textarea.form-control {
            min-height: 120px;
            line-height: 1.6;
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 1rem;
            padding: 1rem;
            border: 1px solid var(--border-steel);
            background: rgba(255, 255, 255, 0.01);
            cursor: pointer;
        }

        .checkbox-group input {
            width: auto;
        }

        .checkbox-group:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-steel);
            color: #fff;
            padding: 1rem 2rem;
            font-family: var(--font-tech);
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        .btn-primary {
            background: var(--signal-orange);
            border-color: var(--signal-orange);
            color: #000;
        }

        .btn-primary:hover {
            background: #fff;
            border-color: #fff;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border-steel);
            padding-top: 2rem;
        }

        .error-msg {
            color: var(--alert-red);
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        /* Date Input Styling Override */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .sidebar {
                height: auto;
                position: relative;
                flex-direction: row;
                align-items: center;
                flex-wrap: wrap;
            }

            .nav-menu {
                flex-direction: row;
                margin-left: auto;
                margin-top: 0;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-grid">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand-block">
                <h1>Teacher<br>Command<span style="color:var(--signal-orange)">.</span></h1>
                <div class="brand-meta">Admin Access Level</div>
            </div>

            <nav class="nav-menu">
                <a href="/teacher/dashboard" class="nav-item">Dashboard</a>
                <a href="/teacher/quizzes" class="nav-item active">Quiz Bank</a>
                <a href="/teacher/sql-test" class="nav-item">SQL Tools</a>
            </nav>

            <div class="user-profile">
                <span class="user-name" th:text="${teacher.fullName}">Instructor</span>
                <a href="/logout" class="logout-link">Term. Session [Logout]</a>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main-content">
            <header class="top-header">
                <div>
                    <div class="page-subtitle">/// MODULE PROTOCOLS</div>
                    <div class="page-title">
                        <h2>Create Module</h2>
                    </div>
                </div>
                <div>
                    <a href="/teacher/quizzes" class="btn">
                        ← Cancel Protocol
                    </a>
                </div>
            </header>

            <div class="form-container">
                <form th:action="@{/teacher/quiz/create}" th:object="${quiz}" method="post">

                    <div class="panel">
                        <div class="panel-header">
                            <i class="fas fa-cube"></i> Module Parameters
                        </div>

                        <div th:if="${error}" class="error-msg"
                            style="margin-bottom:1rem; padding:1rem; border:1px solid var(--alert-red);">
                            Error: <span th:text="${error}"></span>
                        </div>

                        <div class="form-group">
                            <label>Module Designation (Title) *</label>
                            <input type="text" class="form-control" th:field="*{title}"
                                placeholder="e.g. SQL Advanced JOINs Assessment" required>
                            <div th:if="${#fields.hasErrors('title')}" class="error-msg" th:errors="*{title}">Error
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Context Description</label>
                            <textarea class="form-control" th:field="*{description}"
                                placeholder="Brief overview of assessment scope..."></textarea>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                            <div class="form-group">
                                <label>Time Limit (Minutes)</label>
                                <input type="number" class="form-control" th:field="*{timeLimit}" placeholder="60">
                            </div>
                            <div class="form-group">
                                <label>Max Attempts</label>
                                <input type="number" class="form-control" th:field="*{maxAttempts}" placeholder="3" value="3">
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                            <div class="form-group">
                                <label>Activation Date</label>
                                <input type="datetime-local" class="form-control" th:field="*{startTime}">
                            </div>
                            <div class="form-group">
                                <label>Termination Date</label>
                                <input type="datetime-local" class="form-control" th:field="*{endTime}">
                            </div>
                        </div>

                        <label class="checkbox-group">
                            <input type="checkbox" th:field="*{isActive}">
                            <span>Module Active (Visible to Candidates)</span>
                        </label>

                        <div class="actions">
                            <a href="/teacher/quizzes" class="btn">Abort</a>
                            <button type="submit" class="btn btn-primary">Initialize Module</button>
                        </div>
                    </div>

                </form>
            </div>
        </main>
    </div>
</body>

</html>
