<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SqlQuiz. / Berlin Concrete</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-concrete: #141414;
            --signal-orange: #ff3c00;
            --blueprint-blue: #0044ff;
            --font-display: 'Space Grotesk', sans-serif;
            --font-tech: 'IBM Plex Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-concrete);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            color: #e0e0e0;
            font-family: var(--font-display);
            overflow-x: hidden;
        }

        /* HEADER */
        .landing-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .auth-links {
            font-family: var(--font-tech);
            display: flex;
            gap: 2rem;
        }

        .auth-links a {
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        /* HERO */
        .hero-section {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem;
            position: relative;
        }

        .hero-tag {
            font-family: var(--font-tech);
            color: var(--signal-orange);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .hero-title {
            font-size: 6rem;
            line-height: 0.9;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2rem;
            letter-spacing: -0.05em;
        }

        .hero-title span {
            color: transparent;
            -webkit-text-stroke: 1px #fff;
        }

        .hero-desc {
            font-family: var(--font-tech);
            max-width: 600px;
            margin-bottom: 3rem;
            color: #888;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .cta-btn {
            background: var(--blueprint-blue);
            color: #fff;
            padding: 1.5rem 3rem;
            font-size: 1.2rem;
            text-decoration: none;
            text-transform: uppercase;
            font-family: var(--font-tech);
            border: 1px solid var(--blueprint-blue);
            transition: all 0.3s;
        }

        .cta-btn:hover {
            background: transparent;
            color: var(--blueprint-blue);
        }

        /* STATS */
        .grid-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            text-align: center;
        }

        .stat-item:last-child {
            border-right: none;
        }

        .stat-val {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            display: block;
        }

        .stat-lbl {
            font-family: var(--font-tech);
            color: #666;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 3rem;
            }

            .grid-stats {
                grid-template-columns: 1fr;
            }

            .stat-item {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .landing-nav {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>

<body>

    <nav class="landing-nav">
        <div class="brand">SqlQuiz<span style="color:var(--signal-orange)">.</span></div>
        <div class="auth-links">
            <a href="/login">Login</a>
            <a href="/register">Initialize Account</a>
        </div>
    </nav>

    <header class="hero-section">
        <div class="hero-tag">System Version 2.0</div>
        <h1 class="hero-title">
            Master<br>
            <span>The Query</span>
        </h1>
        <p class="hero-desc">
            An advanced environment for SQL proficiency verification.
            Brutalist efficiency for serious engineers.
        </p>
        <a href="/register" class="cta-btn">Begin Protocol</a>
    </header>

    <div class="grid-stats">
        <div class="stat-item">
            <span class="stat-val">1.2k</span>
            <span class="stat-lbl">Active Agents</span>
        </div>
        <div class="stat-item">
            <span class="stat-val">50+</span>
            <span class="stat-lbl">Modules</span>
        </div>
        <div class="stat-item">
            <span class="stat-val">99%</span>
            <span class="stat-lbl">Uptime</span>
        </div>
        <div class="stat-item">
            <span class="stat-val">AUTO</span>
            <span class="stat-lbl">Grading</span>
        </div>
    </div>

</body>

</html>
