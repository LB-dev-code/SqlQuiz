<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Flight Check / Berlin Concrete</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            /* Berlin Concrete Palette */
            --bg-concrete: #141414;
            --surface-raw: rgba(255, 255, 255, 0.03);
            --glass-smoke: rgba(10, 10, 10, 0.6);
            --border-steel: rgba(255, 255, 255, 0.15);

            /* Accents */
            --signal-orange: #ff3c00;
            --blueprint-blue: #0044ff;
            --success-green: #00ff66;
            --alert-red: #ff003c;

            /* Typography */
            --font-display: 'Space Grotesk', sans-serif;
            --font-tech: 'IBM Plex Mono', monospace;

            --space-unit: 1.5rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-concrete);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            color: #e0e0e0;
            font-family: var(--font-tech);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .review-container {
            width: 100%;
            max-width: 900px;
            padding: 2rem;
        }

        .glass-panel {
            background: var(--glass-smoke);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-steel);
            padding: 3rem;
            position: relative;
        }

        /* HEADER */
        .review-header {
            text-align: center;
            border-bottom: 1px solid var(--border-steel);
            padding-bottom: 2rem;
            margin-bottom: 2rem;
        }

        .h1-huge {
            font-family: var(--font-display);
            font-size: 2.5rem;
            line-height: 0.9;
            color: #fff;
            text-transform: uppercase;
        }

        .meta-line {
            color: #666;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            text-transform: uppercase;
        }

        /* STATUS GRID */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .status-node {
            aspect-ratio: 1;
            border: 1px solid var(--border-steel);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .status-node:hover {
            border-color: #fff;
            color: #fff;
        }

        .status-node.answered {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .status-node.answered::after {
            content: '✓';
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 0.7rem;
            color: var(--success-green);
        }

        /* LEGEND */
        .legend-row {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 3rem;
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
        }

        .legend-item span {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin-right: 5px;
            background: #333;
            border: 1px solid #444;
        }

        .legend-item.fill span {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* ACTIONS */
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-steel);
            padding-top: 2rem;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-steel);
            color: #fff;
            padding: 1rem 2rem;
            font-family: var(--font-display);
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        .btn-danger {
            background: var(--alert-red);
            border-color: var(--alert-red);
            color: #fff;
        }

        .btn-danger:hover {
            background: #fff;
            color: var(--alert-red);
        }
    </style>
</head>

<body>

    <div class="review-container">
        <div class="glass-panel">

            <header class="review-header">
                <h1 class="h1-huge">Final<br>Check</h1>
                <div class="meta-line">
                    Protocol: <span th:text="${submission.quiz.title}">QUIZ</span> //
                    Status: PENDING
                </div>
            </header>

            <div class="status-grid">
                <div class="status-node" th:each="qa,qaStat : ${questionAnswers}"
                    th:classappend="${qa.studentSql != null and !qa.studentSql.isEmpty()} ? 'answered' : ''"
                    th:onclick="|goToQuestion(${qaStat.count})|">
                    <span th:text="${qaStat.count}">1</span>
                </div>
            </div>

            <div class="legend-row">
                <div class="legend-item"><span></span> Empty Info</div>
                <div class="legend-item fill"><span></span> Data Logged</div>
            </div>

            <div class="action-row">
                <button class="btn" onclick="goBack()">← Return to Editor</button>
                <button class="btn btn-danger" onclick="submitQuiz()">CONFIRM SUBMISSION</button>
            </div>

        </div>
    </div>

    <script th:inline="javascript">
        const submissionId = /*[[${submission.id}]]*/ 0;

        function goBack() {
            window.location.href = `/student/submission/${submissionId}`;
        }

        function goToQuestion(questionNumber) {
            window.location.href = `/student/submission/${submissionId}#question-${questionNumber}`;
        }

        function submitQuiz() {
            if (confirm('WARNING: SUBMISSION IS FINAL. PROCEED?')) {
                fetch(`/student/submission/${submissionId}/submit`, {
                    method: 'POST'
                })
                    .then(response => {
                        if (response.ok) {
                            window.location.href = `/student/submission/${submissionId}/result`;
                        } else {
                            alert("ERROR: SUBMISSION FAILED.");
                        }
                    })
                    .catch(error => {
                        console.error('Submit error:', error);
                    });
            }
        }
    </script>
</body>

</html>
