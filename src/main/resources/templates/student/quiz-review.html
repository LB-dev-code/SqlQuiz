<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Answers - MySQL Knowledge Testing Platform</title>
    
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0b0f14;
            --bg-grad-1: #0b0f14;
            --bg-grad-2: #0e1219;
            --panel: rgba(18, 22, 29, 0.55);
            --panel-strong: rgba(18, 22, 29, 0.75);
            --white: #e8edf7;
            --muted: #9aa6b2;
            --text-dim: #6b7280;
            --field: rgba(255,255,255,0.06);
            --field-border: rgba(255,255,255,0.12);
            --field-focus: rgba(100, 180, 255, 0.25);
            --accent-1: #6e74ff;
            --accent-2: #6ce1ff;
            --accent: #5b8cff;
            --accent-hover: #4979ff;
            --danger: #ff5f8a;
            --success: #4ff0a7;
            --warning: #ffc857;
            --shadow-1: rgba(0, 0, 0, 0.35);
            --shadow-2: rgba(0, 20, 60, 0.35);
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 10px;
            --spacing-1: 8px;
            --spacing-2: 12px;
            --spacing-3: 16px;
            --spacing-4: 24px;
            --spacing-5: 32px;
            --spacing-6: 40px;
            --font-sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Inter", system-ui, -apple-system, sans-serif;
            --font-display: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Montserrat", var(--font-sans);
        }

        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            background: linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--white);
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
        }

        .page {
            max-width: 1000px;
            margin: 0 auto;
            padding: var(--spacing-6);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: var(--spacing-6);
        }

        .header h1 {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 var(--spacing-2);
            color: var(--white);
        }

        .header .subtitle {
            font-size: 16px;
            color: var(--muted);
        }

        .quiz-info {
            background: var(--panel);
            border: 1px solid var(--field-border);
            backdrop-filter: saturate(140%) blur(14px);
            -webkit-backdrop-filter: saturate(140%) blur(14px);
            border-radius: var(--radius-lg);
            padding: var(--spacing-4);
            margin-bottom: var(--spacing-5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
            font-size: 14px;
        }

        .info-item i {
            color: var(--accent);
            font-size: 18px;
        }

        .info-value {
            font-weight: 600;
            color: var(--white);
        }

        .question-list {
            background: var(--panel);
            border: 1px solid var(--field-border);
            backdrop-filter: saturate(140%) blur(14px);
            -webkit-backdrop-filter: saturate(140%) blur(14px);
            border-radius: var(--radius-lg);
            padding: var(--spacing-5);
            margin-bottom: var(--spacing-5);
            flex: 1;
        }

        .list-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: var(--spacing-4);
            color: var(--white);
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
        }

        .list-header i {
            color: var(--accent);
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: var(--spacing-3);
        }

        .question-item {
            background: var(--field);
            border: 2px solid var(--field-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-3);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .question-item:hover {
            background: var(--field-focus);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .question-item.answered {
            background: rgba(79, 240, 167, 0.15);
            border-color: var(--success);
        }

        .question-item.answered::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 12px;
            color: var(--success);
        }

        .question-number {
            font-size: 16px;
            font-weight: 600;
            color: var(--white);
            margin-bottom: var(--spacing-1);
        }

        .question-status {
            font-size: 12px;
            color: var(--muted);
        }

        .question-item.answered .question-status {
            color: var(--success);
        }

        .actions {
            display: flex;
            gap: var(--spacing-3);
            justify-content: center;
            margin-top: var(--spacing-5);
        }

        .btn {
            padding: var(--spacing-3) var(--spacing-5);
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
            text-decoration: none;
        }

        .btn i {
            font-size: 18px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(110, 116, 255, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--field-border);
            color: var(--white);
        }

        .btn-outline:hover {
            background: var(--field);
            border-color: var(--accent);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 95, 138, 0.3);
        }

        .legend {
            display: flex;
            gap: var(--spacing-4);
            justify-content: center;
            margin-top: var(--spacing-4);
            padding-top: var(--spacing-4);
            border-top: 1px solid var(--field-border);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
            font-size: 14px;
            color: var(--muted);
        }

        .legend-box {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid var(--field-border);
        }

        .legend-box.answered {
            background: rgba(79, 240, 167, 0.15);
            border-color: var(--success);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--panel-strong);
            border: 1px solid var(--field-border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: var(--radius-md);
            padding: var(--spacing-3) var(--spacing-4);
            box-shadow: 0 8px 24px var(--shadow-1);
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
            opacity: 0;
            transform: translateX(100px);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.warning { border-left: 4px solid var(--warning); }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <h1>Review Your Answers</h1>
            <p class="subtitle">Check your progress before submitting</p>
        </div>

        <div class="quiz-info">
            <div class="info-item">
                <i class="fas fa-book"></i>
                <div>
                    <div class="info-label" style="color: var(--muted); font-size: 12px;">Quiz</div>
                    <div class="info-value" th:text="${submission.quiz.title}">Quiz Title</div>
                </div>
            </div>
            <div class="info-item">
                <i class="fas fa-question-circle"></i>
                <div>
                    <div class="info-label" style="color: var(--muted); font-size: 12px;">Total Questions</div>
                    <div class="info-value" th:text="${#lists.size(questionAnswers)}">0</div>
                </div>
            </div>
            <div class="info-item">
                <i class="fas fa-check-circle"></i>
                <div>
                    <div class="info-label" style="color: var(--muted); font-size: 12px;">Answered</div>
                    <div class="info-value" th:text="${answeredCount}">0</div>
                </div>
            </div>
        </div>

        <div class="question-list">
            <div class="list-header">
                <i class="fas fa-list"></i>
                Question Overview
            </div>
            
            <div class="question-grid">
                <div class="question-item" 
                     th:each="qa,qaStat : ${questionAnswers}"
                     th:classappend="${qa.studentSql != null and !qa.studentSql.isEmpty()} ? 'answered' : ''"
                     th:onclick="|goToQuestion(${qaStat.count})|">
                    <div class="question-number" th:text="${qaStat.count}">1</div>
                    <div class="question-status" 
                         th:text="${qa.studentSql != null and !qa.studentSql.isEmpty()} ? 'Answered' : 'Not Answered'">
                        Not Answered
                    </div>
                </div>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-box"></div>
                    <span>Not Answered</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box answered"></div>
                    <span>Answered</span>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-outline" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
                Back to Quiz
            </button>
            <button class="btn btn-danger" onclick="submitQuiz()">
                <i class="fas fa-paper-plane"></i>
                Submit Quiz
            </button>
        </div>
    </div>

    <script th:inline="javascript">
        const submissionId = /*[[${submission.id}]]*/ 0;

        function goBack() {
            window.location.href = `/student/submission/${submissionId}`;
        }

        function goToQuestion(questionNumber) {
            window.location.href = `/student/submission/${submissionId}#question-${questionNumber}`;
        }

        function submitQuiz() {
            if (confirm('Are you sure you want to submit this quiz? You will not be able to make changes after submission.')) {
                fetch(`/student/submission/${submissionId}/submit`, {
                    method: 'POST'
                })
                .then(response => {
                    if (response.ok) {
                        showToast('Quiz submitted successfully!', 'success');
                        setTimeout(() => {
                            window.location.href = `/student/submission/${submissionId}/result`;
                        }, 1500);
                    } else {
                        showToast('Failed to submit quiz', 'error');
                    }
                })
                .catch(error => {
                    console.error('Submit error:', error);
                    showToast('Error: ' + error.message, 'error');
                });
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? 'check-circle' : 
                        type === 'error' ? 'exclamation-circle' : 'info-circle';
            
            toast.innerHTML = `
                <i class="fas fa-${icon}"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
