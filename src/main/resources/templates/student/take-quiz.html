<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Execution / Berlin Concrete</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/neo.min.css">

    <style>
        :root {
            /* Berlin Concrete Palette */
            --bg-concrete: #141414;
            --surface-raw: rgba(255, 255, 255, 0.03);
            --glass-smoke: rgba(10, 10, 10, 0.6);
            --border-steel: rgba(255, 255, 255, 0.15);

            /* Accents */
            --signal-orange: #ff3c00;
            --blueprint-blue: #0044ff;
            --success-green: #00ff66;
            --alert-red: #ff003c;

            /* Typography */
            --font-display: 'Space Grotesk', sans-serif;
            --font-tech: 'IBM Plex Mono', monospace;

            /* Metrics */
            --space-unit: 1.5rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-concrete);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            color: #e0e0e0;
            font-family: var(--font-tech);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .execution-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: 100vh;
        }

        /* SIDEBAR / HUD */
        .hud-sidebar {
            background: var(--glass-smoke);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-steel);
            padding: var(--space-unit);
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .hud-header h1 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .hud-header .meta-tag {
            font-size: 0.7rem;
            color: var(--signal-orange);
            text-transform: uppercase;
        }

        /* TIMER MODULE */
        .timer-module {
            border: 1px solid var(--border-steel);
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .timer-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .timer-value {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: #fff;
            line-height: 1;
        }

        .timer-value.warning {
            color: yellow;
        }

        .timer-value.danger {
            color: var(--alert-red);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        /* NAV GRID */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.5rem;
        }

        .nav-node {
            aspect-ratio: 1;
            border: 1px solid var(--border-steel);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-node:hover {
            border-color: #fff;
            color: #fff;
        }

        .nav-node.active {
            background: var(--signal-orange);
            color: #000;
            border-color: var(--signal-orange);
        }

        .nav-node.completed {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        /* MAIN STAGE */
        .main-stage {
            padding: 0;
            position: relative;
        }

        /* PROGRESS BAR TOP */
        .top-progress {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            width: 100%;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--signal-orange);
            width: 0%;
            transition: width 0.3s;
        }

        /* QUESTION CARD */
        .question-zone {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .q-card {
            border: 1px solid var(--border-steel);
            background: var(--surface-raw);
            margin-bottom: 2rem;
        }

        .q-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-steel);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .q-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .q-meta {
            font-size: 0.8rem;
            color: #888;
            display: flex;
            gap: 1rem;
        }

        .q-body {
            padding: 2rem;
            font-size: 1rem;
            color: #ccc;
            line-height: 1.6;
        }

        /* DB SCHEMA */
        .schema-box {
            background: #000;
            border: 1px solid var(--border-steel);
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }

        .schema-label {
            color: var(--signal-orange);
            text-transform: uppercase;
            font-size: 0.7rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        /* EDITOR */
        .editor-box {
            margin-top: 1.5rem;
        }

        .CodeMirror {
            height: 300px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.9rem;
            border: 1px solid var(--border-steel);
            background: #0b0b0b !important;
            color: #eee !important;
        }

        .cm-s-neo.CodeMirror {
            background: #0b0b0b;
            color: #eee;
        }

        .cm-s-neo .CodeMirror-gutters {
            background: #111;
            border-right: 1px solid #333;
        }

        .cm-s-neo span.cm-keyword {
            color: var(--signal-orange);
        }

        /* ACTION BAR */
        .action-bar {
            padding: 1.5rem;
            border-top: 1px solid var(--border-steel);
            display: flex;
            gap: 1rem;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-steel);
            color: #fff;
            padding: 0.8rem 1.5rem;
            font-family: var(--font-tech);
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: var(--blueprint-blue);
            border-color: var(--blueprint-blue);
        }

        .btn-primary:hover {
            background: #fff;
            color: var(--blueprint-blue);
        }

        .btn-submit-all {
            width: 100%;
            background: var(--signal-orange);
            color: #000;
            border: none;
            padding: 1.5rem;
            font-family: var(--font-display);
            font-size: 1.5rem;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 2rem;
        }

        .btn-submit-all:hover {
            background: #fff;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .execution-grid {
                grid-template-columns: 1fr;
            }

            .hud-sidebar {
                height: auto;
                position: relative;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                border-bottom: 1px solid var(--border-steel);
                border-right: none;
            }

            .nav-grid {
                display: flex;
                overflow-x: auto;
                gap: 0.5rem;
                padding-bottom: 0.5rem;
            }

            .nav-node {
                min-width: 40px;
            }
        }
    </style>
    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/sql/sql.min.js"></script>
</head>

<body>

    <div class="execution-grid">

        <!-- HUD SIDEBAR -->
        <aside class="hud-sidebar">
            <div class="hud-header">
                <h1>Execution<br>Mode</h1>
                <div class="meta-tag">Quiz ID: <span th:text="${quiz.id}">000</span></div>
            </div>

            <div class="timer-module">
                <div class="timer-label" th:if="${timeRemaining ge 0}">Time Remaining</div>
                <div class="timer-label" th:if="${timeRemaining lt 0}">Timer</div>

                <div class="timer-value" id="timeRemaining" th:if="${timeRemaining ge 0}">00:00</div>
                <div class="timer-value" th:if="${timeRemaining lt 0}">--:--</div>
            </div>

            <div>
                <div class="timer-label">Navigation Grid</div>
                <div class="nav-grid">
                    <div class="nav-node" th:each="question,questionStat : ${questions}"
                        th:classappend="${questionStat.first ? 'active' : ''}"
                        th:onclick="|scrollToQuestion(${question.id})|" th:text="${questionStat.count}">1</div>
                </div>
            </div>

            <div style="margin-top: auto; font-size: 0.7rem; color: #666;">
                Connection Secure.<br>
                Auto-save Active.
            </div>
        </aside>

        <!-- MAIN STAGE -->
        <main class="main-stage">
            <div class="top-progress">
                <div class="progress-bar-fill" id="overallProgress" style="width: 0%"></div>
            </div>

            <div class="question-zone" id="questionsContainer">

                <div class="q-card" th:each="question,questionStat : ${questions}" th:data-question-id="${question.id}"
                    th:id="'question-card-' + ${question.id}">

                    <div class="q-header">
                        <div>
                            <div class="q-title">
                                <span style="color:var(--signal-orange); font-size: 1rem;">Q<span
                                        th:text="${questionStat.count}">1</span> //</span>
                                <span th:text="${question.content}">Query Title</span>
                            </div>
                            <div class="q-meta">
                                <span th:text="${question.questionType.englishName}">SQL</span>
                                <span>|</span>
                                <span th:text="${question.score} + ' PTS'">10 PTS</span>
                            </div>
                        </div>
                    </div>

                    <div class="q-body">
                        <!-- Question stem: always show content as main question text -->
                        <div style="margin-bottom: 1rem; color: #e0e0e0; font-size: 1.05rem; line-height: 1.7;">
                            <span th:text="${question.content}">Question text</span>
                        </div>

                        <!-- Additional description (if exists and non-empty) -->
                        <div th:if="${question.description != null and !question.description.trim().isEmpty()}"
                             style="margin-bottom: 1rem; color: #aaa; line-height: 1.6;"
                             th:utext="${question.description}">
                            Description...
                        </div>

                        <!-- SCHEMA -->
                        <div class="schema-box" th:if="${question.databaseContext}">
                            <div th:utext="${question.databaseContext}"
                                style="white-space: pre-wrap; font-family: var(--font-tech); color: #aaa;">
                            </div>
                        </div>

                        <!-- EDITOR -->
                        <div class="editor-box">
                            <span class="schema-label" style="margin-bottom: 0.5rem;">Input Terminal</span>
                            <textarea class="sql-editor" th:data-question-id="${question.id}"></textarea>
                        </div>
                    </div>

                    <div class="action-bar">
                        <button class="btn" th:onclick="|clearSQL(${question.id})|">Clear Input</button>
                        <!-- In a real app, maybe a 'Run/Test' button here if supported -->
                    </div>
                </div>

                <!-- SUBMIT ALL -->
                <button class="btn-submit-all" onclick="submitQuiz()">
                    Terminating Session // Submit All
                </button>
                <div style="text-align: center; margin-top: 1rem; font-size: 0.8rem; color: #666;">
                    Action is final.
                </div>

            </div>
        </main>

    </div>

    <script th:inline="javascript">
        // Basic scripts adapted for new IDs

        // --- Timer Logic ---
        let timeRemaining = /*[[${timeRemaining ge 0 ? timeRemaining * 60 : -1}]]*/ 3600;

        function updateTimer() {
            if (timeRemaining < 0) return;

            const m = Math.floor(timeRemaining / 60);
            const s = timeRemaining % 60;
            const display = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

            const el = document.getElementById('timeRemaining');
            if (el) {
                el.textContent = display;
                if (timeRemaining < 300) el.classList.add('danger');
                else if (timeRemaining < 600) el.classList.add('warning');
            }

            if (timeRemaining <= 0) {
                // Auto submit
                submitQuiz();
            }
            timeRemaining--;
        }

        if (timeRemaining >= 0) {
            setInterval(updateTimer, 1000);
        }

        // --- Editor Init ---
        document.querySelectorAll('.sql-editor').forEach(textarea => {
            CodeMirror.fromTextArea(textarea, {
                mode: 'text/x-mysql',
                theme: 'neo',
                lineNumbers: true,
                viewportMargin: Infinity
            });
        });

        // --- Navigation ---
        function scrollToQuestion(id) {
            const el = document.getElementById('question-card-' + id);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function clearSQL(id) {
            // Find CM instance for this ID - naive approach for mockup
            // In real impl, map QuestionID -> CM Instance
            const card = document.getElementById('question-card-' + id);
            const cmEl = card.querySelector('.CodeMirror');
            if (cmEl && cmEl.CodeMirror) {
                cmEl.CodeMirror.setValue('');
            }
        }

        // Store CodeMirror instance mapping
        const editorMap = new Map();

        // --- Editor Init ---
        document.querySelectorAll('.sql-editor').forEach(textarea => {
            const cm = CodeMirror.fromTextArea(textarea, {
                mode: 'text/x-mysql',
                theme: 'neo',
                lineNumbers: true,
                viewportMargin: Infinity
            });
            const questionId = textarea.getAttribute('data-question-id');
            editorMap.set(questionId, cm);

            // Auto-save: Save answer when input stops for 1 second
            let saveTimeout;
            cm.on('change', () => {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(() => {
                    saveAnswer(questionId, cm.getValue());
                }, 1000);
            });
        });

        // Save single answer
        function saveAnswer(questionId, sql) {
            const submissionId = /*[[${submission.id}]]*/ 0;

            fetch('/student/submission/' + submissionId + '/answer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({
                    questionId: questionId,
                    sql: sql
                })
            })
            .then(response => response.text())
            .then(data => {
                if (data !== 'success' && !data.startsWith('error')) {
                    console.log('Answer saved for question ' + questionId);
                }
            })
            .catch(error => {
                console.error('Auto-save failed for question ' + questionId + ':', error);
            });
        }

        function submitQuiz() {
            if (!confirm("CONFIRM TERMINATION?")) return;

            const submissionId = /*[[${submission.id}]]*/ 0;

            // Disable button to prevent double submission
            const btn = document.querySelector('.btn-submit-all');
            btn.disabled = true;
            btn.textContent = 'Saving answers...';

            // Save all answers first
            const savePromises = [];
            editorMap.forEach((cm, questionId) => {
                const sql = cm.getValue();
                if (sql && sql.trim()) {
                    savePromises.push(
                        fetch('/student/submission/' + submissionId + '/answer', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded'
                            },
                            body: new URLSearchParams({
                                questionId: questionId,
                                sql: sql
                            })
                        })
                    );
                }
            });

            // Wait for all answers to be saved, then submit quiz
            Promise.all(savePromises)
                .then(() => {
                    btn.textContent = 'Submitting...';
                    return fetch('/student/submission/' + submissionId + '/submit', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                })
                .then(response => response.text())
                .then(data => {
                    if (data === 'success' || !data.startsWith('error')) {
                        window.location.href = '/student/submission/' + submissionId + '/result';
                    } else {
                        alert('Submit failed: ' + data);
                        btn.disabled = false;
                        btn.textContent = 'Terminating Session // Submit All';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Submit failed: ' + error);
                    btn.disabled = false;
                    btn.textContent = 'Terminating Session // Submit All';
                });
        }
    </script>

</body>

</html>
