<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive / Berlin Concrete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Berlin Concrete Palette */
            --bg-concrete: #141414;
            --surface-raw: rgba(255, 255, 255, 0.03);
            --glass-smoke: rgba(10, 10, 10, 0.6);
            --glass-frost: rgba(255, 255, 255, 0.02);
            --border-steel: rgba(255, 255, 255, 0.15);

            /* Accents */
            --signal-orange: #ff3c00;
            --blueprint-blue: #0044ff;
            --success-green: #00ff66;

            /* Typography */
            --font-display: 'Space Grotesk', sans-serif;
            --font-tech: 'IBM Plex Mono', monospace;

            /* Metrics */
            --space-unit: 1.5rem;
            --brutal-gap: 2px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-concrete);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            color: #e0e0e0;
            font-family: var(--font-tech);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Brutalist Layout Grid */
        .poster-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        /* SIDEBAR / NAVIGATION */
        .col-nav {
            background: var(--glass-smoke);
            backdrop-filter: blur(20px) grayscale(100%);
            border-right: 1px solid var(--border-steel);
            padding: var(--space-unit);
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-block h1 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 2rem;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
        }

        .brand-meta {
            font-size: 0.7rem;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 4rem;
        }

        .nav-item {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: #888;
            text-decoration: none;
            transition: color 0.2s, padding-left 0.2s;
            position: relative;
        }

        .nav-item:hover,
        .nav-item.active {
            color: #fff;
            padding-left: 10px;
        }

        .nav-item.active::before {
            content: '→';
            position: absolute;
            left: -15px;
            color: var(--signal-orange);
        }

        .user-block {
            border-top: 1px solid var(--border-steel);
            padding-top: 1rem;
        }

        .user-avatar {
            font-size: 3rem;
            font-family: var(--font-display);
            line-height: 1;
            color: var(--signal-orange);
            margin-bottom: 0.5rem;
        }

        /* MAIN CONTENT AREA */
        .col-main {
            padding: 0;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .manifesto-header {
            padding: calc(var(--space-unit) * 2);
            border-bottom: 1px solid var(--border-steel);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .header-title h2 {
            font-family: var(--font-display);
            font-size: 3rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .header-meta {
            font-family: var(--font-tech);
            color: var(--signal-orange);
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        /* FILTERS */
        .toolbar {
            border-bottom: 1px solid var(--border-steel);
            display: flex;
            flex-wrap: wrap;
        }

        .tool-group {
            padding: var(--space-unit);
            border-right: 1px solid var(--border-steel);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
            min-width: 15px;
        }

        .tool-label {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
        }

        .raw-input,
        .raw-select {
            background: transparent;
            border: none;
            border-bottom: 1px solid #444;
            color: #fff;
            font-family: var(--font-tech);
            font-size: 0.9rem;
            padding: 0.25rem 0;
            outline: none;
            width: 100%;
        }

        .raw-select {
            cursor: pointer;
        }

        .raw-select option {
            background: #111;
            color: #fff;
        }

        /* DATA GRID */
        .data-list {
            display: flex;
            flex-direction: column;
        }

        .data-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 100px;
            padding: 1rem var(--space-unit);
            border-bottom: 1px solid var(--border-steel);
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .data-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 100px;
            padding: 1.5rem var(--space-unit);
            border-bottom: 1px solid var(--border-steel);
            align-items: center;
            transition: background 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .data-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .cell-main {
            display: flex;
            flex-direction: column;
        }

        .doc-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #fff;
        }

        .doc-meta {
            font-size: 0.8rem;
            color: #666;
        }

        .cell-mono {
            font-family: var(--font-tech);
            font-size: 0.9rem;
            color: #aaa;
        }

        .status-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            border: 1px solid #444;
            padding: 2px 6px;
            display: inline-block;
            width: fit-content;
        }

        .status-tag.completed {
            color: #fff;
            border-color: #fff;
        }

        .status-tag.inprogress {
            color: var(--signal-orange);
            border-color: var(--signal-orange);
        }

        .score-display {
            font-family: var(--font-display);
            font-size: 1.5rem;
            color: #fff;
            text-align: right;
        }

        .empty-state {
            padding: 4rem;
            text-align: center;
            color: #444;
            font-family: var(--font-tech);
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .poster-grid {
                grid-template-columns: 1fr;
            }

            .col-nav {
                height: auto;
                position: relative;
                flex-direction: row;
                align-items: center;
                border-bottom: 1px solid var(--border-steel);
                border-right: none;
            }

            .nav-menu {
                flex-direction: row;
                margin-top: 0;
                margin-left: auto;
            }

            .nav-item {
                font-size: 1rem;
            }

            .data-header {
                display: none;
            }

            .data-row {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .score-display {
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <div class="poster-grid">

        <aside class="col-nav">
            <div class="brand-block">
                <h1>Sql<br>Quiz<span style="color:var(--signal-orange)">.</span></h1>
                <div class="brand-meta">Berlin Concrete Build</div>
            </div>

            <nav class="nav-menu">
                <a href="/student/dashboard" class="nav-item">Dashboard</a>
                <a href="/student/submissions" class="nav-item active">History</a>
            </nav>

            <div class="user-block">
                <div class="user-avatar"
                    th:text="${student != null ? #strings.substring(student.fullName, 0, 1) : 'S'}">S</div>
                <div style="font-size: 0.9rem; color: #fff;" th:text="${student != null ? student.fullName : 'User'}">
                    User</div>
                <a href="/logout"
                    style="color: #666; text-decoration: none; font-size: 0.8rem; margin-top: 0.5rem; display: block;">›
                    LOGOUT</a>
            </div>
        </aside>

        <main class="col-main">

            <header class="manifesto-header">
                <div class="header-title">
                    <div class="header-meta">/// ARCHIVE ACCESS</div>
                    <h2>Data<br>Logs</h2>
                </div>
                <!-- High-level stats could go here if available -->
            </header>

            <div class="toolbar">
                <div class="tool-group">
                    <span class="tool-label">Filter Status</span>
                    <select id="statusFilter" class="raw-select">
                        <option value="">ALL RECORDS</option>
                        <option value="COMPLETED">COMPLETED</option>
                        <option value="IN_PROGRESS">IN PROGRESS</option>
                    </select>
                </div>
                <div class="tool-group">
                    <span class="tool-label">Sort Order</span>
                    <select id="sortOrder" class="raw-select">
                        <option value="desc">NEWEST FIRST</option>
                        <option value="asc">OLDEST FIRST</option>
                        <option value="score">PERFORMANCE</option>
                    </select>
                </div>
                <div class="tool-group" style="flex: 2;">
                    <span class="tool-label">Search Query</span>
                    <input type="text" id="searchInput" class="raw-input" placeholder="ENTER KEYWORD...">
                </div>
            </div>

            <div class="data-list">
                <div class="data-header">
                    <div>Document</div>
                    <div>Timestamp</div>
                    <div>Status</div>
                    <div>Duration</div>
                    <div style="text-align: right;">Yield</div>
                </div>

                <div th:if="${#lists.isEmpty(submissions)}" class="empty-state">
                    NO ARCHIVED RECORDS FOUND
                </div>

                <div th:if="${!#lists.isEmpty(submissions)}">
                    <a th:each="submission : ${submissions}"
                        th:href="${submission.status.name() == 'COMPLETED'} ? @{/student/submission/{id}/result(id=${submission.id})} : @{/student/submission/{id}(id=${submission.id})}"
                        class="data-row">

                        <div class="cell-main">
                            <span class="doc-title" th:text="${submission.quiz.title}">Quiz Title</span>
                            <span class="doc-meta" th:text="'INST: ' + ${submission.quiz.teacher.fullName}">Inst:
                                Admin</span>
                        </div>

                        <div class="cell-mono" th:text="${#temporals.format(submission.startTime, 'yyyy-MM-dd HH:mm')}">
                            2024-01-01 12:00
                        </div>

                        <div>
                            <span class="status-tag" th:text="${submission.status}"
                                th:classappend="${submission.status.name() == 'COMPLETED' ? 'completed' : 'inprogress'}">COMPLETED</span>
                        </div>

                        <div class="cell-mono">
                            <span th:if="${submission.submitTime}"
                                th:text="${T(java.time.Duration).between(submission.startTime, submission.submitTime).toMinutes()} + ' MIN'">45
                                MIN</span>
                            <span th:unless="${submission.submitTime}">--</span>
                        </div>

                        <div class="score-display">
                            <span
                                th:text="${submission.percentage != null ? #numbers.formatDecimal(submission.percentage, 0, 0) : '--'}">85</span><span
                                style="font-size: 0.8rem; color: #666;">%</span>
                        </div>

                    </a>
                </div>
            </div>

        </main>

    </div>

    <script>
        // Basic frontend filtering script to match existing functionality
        function filterRows() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const rows = document.querySelectorAll('.data-row');

            rows.forEach(row => {
                const title = row.querySelector('.doc-title').textContent.toLowerCase();
                const rowStatus = row.querySelector('.status-tag').textContent;

                let matchesSearch = title.includes(search);
                let matchesStatus = status === '' || rowStatus === status;

                if (matchesSearch && matchesStatus) {
                    row.style.display = 'grid';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        document.getElementById('searchInput').addEventListener('input', filterRows);
        document.getElementById('statusFilter').addEventListener('change', filterRows);

        // Sorting would ideally be server-side or complex DOM manipulation. 
        // For visual update, we keep it simple here or would need to implement JS sort.
    </script>

</body>

</html>
