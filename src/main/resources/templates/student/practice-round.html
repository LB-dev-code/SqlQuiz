<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Neural Round / Berlin Concrete</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/neo.min.css">

    <style>
        :root {
            /* Berlin Concrete Palette */
            --bg-concrete: #141414;
            --surface-raw: rgba(255, 255, 255, 0.03);
            --glass-smoke: rgba(10, 10, 10, 0.6);
            --border-steel: rgba(255, 255, 255, 0.15);

            /* Accents */
            --signal-orange: #ff3c00;
            --blueprint-blue: #0044ff;
            --success-green: #00ff66;
            --alert-red: #ff003c;

            /* Typography */
            --font-display: 'Space Grotesk', sans-serif;
            --font-tech: 'IBM Plex Mono', monospace;

            --space-unit: 1.5rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-concrete);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            color: #e0e0e0;
            font-family: var(--font-tech);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .practice-header {
            background: var(--glass-smoke);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-steel);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: #fff;
        }

        .progress-dots {
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #333;
            border: 1px solid #444;
        }

        .dot.active {
            background: var(--signal-orange);
            border-color: var(--signal-orange);
        }

        .dot.completed {
            background: #fff;
            border-color: #fff;
        }

        .timer-display {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #fff;
        }

        /* WORKSPACE */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 65px);
            /* Header height approx */
        }

        /* LEFT PANEL: QUESTION */
        .panel-left {
            border-right: 1px solid var(--border-steel);
            padding: 2rem;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.01);
        }

        .q-type-badge {
            font-size: 0.7rem;
            color: var(--blueprint-blue);
            border: 1px solid var(--blueprint-blue);
            padding: 2px 6px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .q-title {
            font-family: var(--font-display);
            font-size: 2rem;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: #fff;
        }

        .q-desc {
            color: #ccc;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .schema-block {
            background: #000;
            border: 1px solid var(--border-steel);
            padding: 1rem;
            font-size: 0.85rem;
            color: #888;
        }

        /* RIGHT PANEL: EDITOR */
        .panel-right {
            display: flex;
            flex-direction: column;
            background: #0b0b0b;
        }

        .editor-wrapper {
            flex: 1;
            position: relative;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'IBM Plex Mono', monospace;
            background: #0b0b0b !important;
            color: #eee !important;
        }

        .control-bar {
            border-top: 1px solid var(--border-steel);
            padding: 1rem;
            background: var(--glass-smoke);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        /* BUTTONS */
        .btn {
            background: transparent;
            border: 1px solid var(--border-steel);
            color: #fff;
            padding: 0.8rem 1.5rem;
            font-family: var(--font-tech);
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-run {
            border-color: var(--blueprint-blue);
            color: var(--blueprint-blue);
        }

        .btn-run:hover {
            background: var(--blueprint-blue);
            color: #fff;
        }

        .btn-submit {
            background: var(--signal-orange);
            border-color: var(--signal-orange);
            color: #000;
        }

        .btn-submit:hover {
            background: #fff;
        }

        /* RESULT AREA */
        .result-zone {
            height: 30%;
            border-top: 1px solid var(--border-steel);
            background: #111;
            padding: 1rem;
            overflow-y: auto;
            font-family: var(--font-tech);
            font-size: 0.85rem;
            color: #aaa;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .workspace {
                grid-template-columns: 1fr;
                overflow-y: auto;
                height: auto;
            }

            .panel-left,
            .panel-right {
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-steel);
            }

            .CodeMirror {
                height: 300px;
            }

            .result-zone {
                height: 200px;
            }
        }

        /* Markdown Table Styles */
        .markdown-table {
            overflow-x: auto;
            margin: 1rem 0;
        }
        .markdown-table table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.85rem;
        }
        .markdown-table th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--signal-orange);
            padding: 0.5rem;
            text-align: left;
            font-family: var(--font-tech);
            font-weight: 600;
            border-bottom: 1px solid var(--border-steel);
        }
        .markdown-table td {
            padding: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #ccc;
        }
        .markdown-table tr:last-child td {
            border-bottom: none;
        }
        .markdown-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Result Table Styles (for SQL execution results) */
        .result-status {
            padding: 0.5rem;
            font-family: var(--font-tech);
            font-size: 0.8rem;
            color: #ccc;
            white-space: nowrap;
        }
        .result-error {
            padding: 0.5rem;
            font-family: var(--font-tech);
            font-size: 0.8rem;
            white-space: pre-wrap;
            color: var(--alert-red);
        }
        .result-table-wrapper {
            overflow-x: auto;
            margin-top: 0.5rem;
        }
        .result-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 0.8rem;
            font-family: var(--font-tech);
        }
        .result-table thead {
            position: sticky;
            top: 0;
        }
        .result-table th {
            background: rgba(255, 255, 255, 0.08);
            color: var(--signal-orange);
            padding: 0.5rem 0.75rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid var(--border-steel);
            white-space: nowrap;
        }
        .result-table td {
            padding: 0.4rem 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #e0e0e0;
            white-space: nowrap;
        }
        .result-table tr:last-child td {
            border-bottom: none;
        }
        .result-table tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }
        .result-table .null-value {
            color: #666;
            font-style: italic;
        }
        .no-results {
            padding: 1rem;
            color: #666;
            font-style: italic;
            text-align: center;
        }
    </style>
    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/sql/sql.min.js"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
</head>

<body>

    <header class="practice-header">
        <a href="#" onclick="window.location.href='/student/practice/dashboard?t=' + Date.now(); return false;" class="back-btn">← Abort Session</a>

        <div class="progress-dots" id="round-steps">
            <!-- JS Injected -->
        </div>

        <div class="timer-display" id="timer">00:00</div>
    </header>

    <div class="workspace">

        <!-- LEFT: CONTEXT -->
        <div class="panel-left">
            <div id="q-loading" style="padding: 2rem; color: #666;">LOADING DATA...</div>

            <div id="q-content" style="display: none;">
                <span class="q-type-badge" id="q-type">SELECT</span>
                <span class="q-type-badge" id="q-diff" style="border-color: #666; color: #666;">MEDIUM</span>

                <h1 class="q-title" id="q-title">Question</h1>
                <div class="q-desc" id="q-desc">Description...</div>

                <div class="schema-block">
                    <div style="color: var(--signal-orange); margin-bottom: 0.5rem; text-transform: uppercase;">Schema
                        Reference</div>
                    <div id="q-db" style="white-space: pre-wrap;"></div>
                </div>
            </div>
        </div>

        <!-- RIGHT: INTERACTION -->
        <div class="panel-right">
            <div class="editor-wrapper">
                <textarea id="sql-editor"></textarea>
            </div>

            <div class="result-zone" id="execution-result">
            </div>

            <div class="control-bar">
                <span id="btn-status"
                    style="margin-right: auto; color: #666; font-size: 0.8rem; align-self: center;"></span>
                <button onclick="runCode()" class="btn btn-run">TEST RUN</button>
                <button onclick="saveAndNext()" class="btn btn-submit" id="save-next-btn">SAVE & NEXT →</button>
                <button onclick="finishRound()" class="btn btn-submit" id="finish-btn" style="display: none;">FINISH ROUND</button>
            </div>
        </div>

    </div>

    <script th:inline="javascript">
        // --- Init CodeMirror ---
        const editor = CodeMirror.fromTextArea(document.getElementById('sql-editor'), {
            mode: 'text/x-mysql',
            theme: 'neo',
            lineNumbers: true
        });

        // --- Mock Data / Logic from original file adapted ---
        const roundId = [[${roundId}]];
        let currentAnswerId = null;
        let questionIndex = 0;
        let startTime = null; // 不立即开始计时，等题目加载完成后再开始
        let timerInterval = null;

        // 调试日志：输出roundId
        console.log('[Practice Round] Page loaded with roundId:', roundId);
        console.log('[Practice Round] Current URL:', window.location.href);

        // Timer - 只有startTime不为null时才计时
        function startTimer() {
            if (timerInterval) return; // 避免重复启动
            startTime = Date.now();
            timerInterval = setInterval(() => {
                if (startTime) {
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
                    const s = String(elapsed % 60).padStart(2, '0');
                    document.getElementById('timer').innerText = `${m}:${s}`;
                }
            }, 1000);
        }

        // Fetch Question Logic ( Simplified for this edit to match structure )
        async function fetchQuestion() {
            // ... (Implementation would mirror the original logic but targeting new IDs)
            // For brevity in design application, assuming the backing JS logic is similar
            // updating DOM elements: q-title, q-desc, q-db etc.

            // Mocking fetch for visual verification if run
            document.getElementById('q-loading').style.display = 'none';
            document.getElementById('q-content').style.display = 'block';

            // In real app, we must port the full fetchQuestion logic here
        }

        // Porting the essential logic needed for the page to function:
        async function fetchQuestionReal(targetIndex = null) {
            document.getElementById('q-loading').style.display = 'block';
            document.getElementById('q-content').style.display = 'none';

            // 题目应该已经在dashboard页面生成完，但增加等待时间以防生成较慢
            const maxRetries = 60; // 60次 * 2秒 = 120秒（2分钟）
            let retryCount = 0;

            while (retryCount < maxRetries) {
                try {
                    const url = targetIndex !== null
                        ? `/student/practice/api/question/${roundId}?index=${targetIndex}`
                        : `/student/practice/api/question/${roundId}`;

                    const response = await fetch(url);
                    const data = await response.json();

                    // 调试日志
                    console.log('[fetchQuestionReal] API Response:', {
                        url: url,
                        roundId: roundId,
                        success: data.success,
                        hasMore: data.hasMore,
                        generating: data.generating,
                        questionIndex: data.questionIndex,
                        answerId: data.answerId
                    });

                    if (data.success && data.hasMore) {
                        currentAnswerId = data.answerId;
                        questionIndex = data.questionIndex;

                        console.log('[fetchQuestionReal] Loaded question:', {
                            roundId: roundId,
                            questionIndex: questionIndex,
                            answerId: currentAnswerId,
                            title: data.title
                        });

                        document.getElementById('q-title').innerText = data.title;
                        document.getElementById('q-desc').innerText = data.content;

                        // Render Markdown table for databaseContext
                        const renderedDb = marked.parse(data.databaseContext || '*No schema available*');
                        document.getElementById('q-db').innerHTML = '<div class="markdown-table">' + renderedDb + '</div>';

                        document.getElementById('q-loading').style.display = 'none';
                        document.getElementById('q-content').style.display = 'block';

                        // 清空编辑器内容，准备输入新答案
                        editor.setValue('');
                        editor.clearHistory();

                        // 清空result area
                        document.getElementById('execution-result').innerHTML = '';

                        // Update dots
                        const dots = document.getElementById('round-steps');
                        dots.innerHTML = '';
                        for (let i = 0; i < 10; i++) {
                            const d = document.createElement('div');
                            d.className = 'dot ' + (i < questionIndex ? 'completed' : (i === questionIndex ? 'active' : ''));
                            dots.appendChild(d);
                        }

                        // 只有第一次加载题目时启动计时器
                        if (questionIndex === 0 && !startTime) {
                            startTimer();
                        }

                        return; // Success, exit the function
                    } else if (data.success && !data.hasMore && !data.generating) {
                        // 轮次真正完成
                        alert("ROUND COMPLETE");
                        window.location.href = `/student/practice/feedback/${roundId}`;
                        return;
                    } else if (data.success && data.generating) {
                        // 题目还在生成中，继续轮询
                        retryCount++;
                        const loadingText = document.getElementById('q-loading');
                        loadingText.innerText = `GENERATING QUESTIONS... ${retryCount * 2}s`;
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        continue;
                    }

                    // If we get here, questions might still be generating
                    // Check if it's a "not found" case (might be generating)
                    if (!data.success && data.error && data.error.includes('not found')) {
                        retryCount++;
                        const loadingText = document.getElementById('q-loading');
                        loadingText.innerText = `LOADING... ${retryCount * 2}s`;
                        await new Promise(resolve => setTimeout(resolve, 2000)); // Wait 2 seconds
                    } else {
                        // Other error, don't retry
                        break;
                    }
                } catch (e) {
                    console.error('Fetch error:', e);
                    if (retryCount >= maxRetries - 1) {
                        document.getElementById('q-loading').innerHTML = 'LOADING FAILED. PLEASE REFRESH.';
                        return;
                    }
                    retryCount++;
                    await new Promise(resolve => setTimeout(resolve, 2000));
                }
            }

            // If we exit the loop without returning, show error
            document.getElementById('q-loading').innerHTML = 'LOADING TIMEOUT. PLEASE GO BACK AND TRY AGAIN.';
        }

        // Start
        fetchQuestionReal();

        // Execute SQL in sandbox (Test Run - doesn't save answer)
        async function runCode() {
            const sql = editor.getValue();
            const resultDiv = document.getElementById('execution-result');

            resultDiv.innerHTML = '<div class="result-status">> RUNNING...</div>';
            resultDiv.style.color = 'var(--success-green)';

            try {
                const response = await fetch('/student/practice/api/run-sql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        answerId: currentAnswerId,
                        sql: sql
                    })
                });

                // Check if response is OK and is JSON
                const contentType = response.headers.get('content-type');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error(`Expected JSON, got ${contentType}`);
                }

                const data = await response.json();

                if (data.success) {
                    let html = `<div class="result-status">> SUCCESS (${data.executionTimeMs || 0}ms) | Rows: ${data.rowCount || 0}</div>`;
                    html += formatResultTable(data.data);
                    resultDiv.innerHTML = html;
                    resultDiv.style.color = 'var(--success-green)';
                } else {
                    resultDiv.innerHTML = `<div class="result-error">> ERROR\n${data.error || 'Unknown error'}</div>`;
                    resultDiv.style.color = 'var(--alert-red)';
                }
            } catch (err) {
                resultDiv.innerHTML = `<div class="result-error">> REQUEST FAILED\n${err.message}</div>`;
                resultDiv.style.color = 'var(--alert-red)';
            }
        }

        // Save answer and automatically move to next question
        async function saveAndNext() {
            const sql = editor.getValue();
            const resultDiv = document.getElementById('execution-result');

            if (!sql || sql.trim() === '') {
                resultDiv.innerHTML = '<div class="result-error">> ERROR: SQL cannot be empty</div>';
                resultDiv.style.color = 'var(--alert-red)';
                return;
            }

            // 直接保存，不显示保存状态
            try {
                const response = await fetch('/student/practice/api/save-answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        answerId: currentAnswerId,
                        sql: sql
                    })
                });

                const contentType = response.headers.get('content-type');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error(`Expected JSON, got ${contentType}`);
                }

                const data = await response.json();

                if (data.success) {
                    // 判断是否是最后一道题
                    const isLastQuestion = questionIndex >= 9; // 0-9共10题

                    // 调试日志
                    console.log('[saveAndNext] Answer saved:', {
                        roundId: roundId,
                        questionIndex: questionIndex,
                        currentAnswerId: currentAnswerId,
                        isLastQuestion: isLastQuestion
                    });

                    if (isLastQuestion) {
                        // 最后一题，显示 FINISH ROUND
                        resultDiv.innerHTML = '<div class="result-status">> ALL QUESTIONS COMPLETED</div>';
                        resultDiv.style.color = 'var(--success-green)';
                        document.getElementById('save-next-btn').style.display = 'none';
                        document.getElementById('finish-btn').style.display = 'inline-block';
                        document.getElementById('btn-status').innerText = `Click FINISH to submit.`;

                        // 设置编辑器为只读，防止修改答案
                        editor.setOption("readOnly", true);
                    } else {
                        // 不是最后一题，自动跳转到下一题
                        fetchQuestionReal(questionIndex + 1);
                        document.getElementById('save-next-btn').style.display = 'inline-block';
                        document.getElementById('finish-btn').style.display = 'none';
                        document.getElementById('btn-status').innerText = ``;
                    }
                } else {
                    resultDiv.innerHTML = `<div class="result-error">> SAVE FAILED\n${data.error || 'Unknown error'}</div>`;
                    resultDiv.style.color = 'var(--alert-red)';
                }
            } catch (err) {
                resultDiv.innerHTML = `<div class="result-error">> REQUEST FAILED\n${err.message}</div>`;
                resultDiv.style.color = 'var(--alert-red)';
            }
        }

        // Finish round and submit all answers for scoring
        async function finishRound() {
            const resultDiv = document.getElementById('execution-result');
            resultDiv.innerHTML = '<div class="result-status">> SUBMITTING ROUND FOR SCORING...</div>';
            resultDiv.style.color = 'var(--signal-orange)';

            try {
                const response = await fetch('/student/practice/api/finish-round', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roundId: roundId })
                });

                const contentType = response.headers.get('content-type');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error(`Expected JSON, got ${contentType}`);
                }

                const data = await response.json();

                if (data.success) {
                    // 跳转到反馈页面
                    window.location.href = `/student/practice/feedback/${roundId}`;
                } else {
                    resultDiv.innerHTML = `<div class="result-error">> SUBMISSION FAILED\n${data.error || 'Unknown error'}</div>`;
                    resultDiv.style.color = 'var(--alert-red)';
                }
            } catch (err) {
                resultDiv.innerHTML = `<div class="result-error">> REQUEST FAILED\n${err.message}</div>`;
                resultDiv.style.color = 'var(--alert-red)';
            }
        }

        // Format result data as HTML table
        function formatResultTable(data) {
            if (!data || !Array.isArray(data) || data.length === 0) {
                return '<div class="no-results">(No results)</div>';
            }

            const headers = Object.keys(data[0]);
            let html = '<div class="result-table-wrapper"><table class="result-table"><thead><tr>';

            // Header row
            headers.forEach(h => {
                html += `<th>${escapeHtml(h)}</th>`;
            });
            html += '</tr></thead><tbody>';

            // Data rows
            data.forEach(row => {
                html += '<tr>';
                headers.forEach(h => {
                    const value = row[h] === null ? '<span class="null-value">NULL</span>' : escapeHtml(String(row[h]));
                    html += `<td>${value}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            return html;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

    </script>
</body>

</html>
