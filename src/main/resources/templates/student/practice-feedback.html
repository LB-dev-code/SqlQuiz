<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Report / Berlin Concrete</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <style>
        :root {
            /* Berlin Concrete Palette */
            --bg-concrete: #141414;
            --surface-raw: rgba(255, 255, 255, 0.03);
            --glass-smoke: rgba(10, 10, 10, 0.6);
            --border-steel: rgba(255, 255, 255, 0.15);

            /* Accents */
            --signal-orange: #ff3c00;
            --blueprint-blue: #0044ff;
            --success-green: #00ff66;
            --alert-red: #ff003c;

            /* Typography */
            --font-display: 'Space Grotesk', sans-serif;
            --font-tech: 'IBM Plex Mono', monospace;

            --space-unit: 1.5rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-concrete);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            color: #e0e0e0;
            font-family: var(--font-tech);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .report-container {
            width: 100%;
            max-width: 900px;
            padding: 2rem;
        }

        .glass-panel {
            background: var(--glass-smoke);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-steel);
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }

        .decorative-blur {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: var(--blueprint-blue);
            filter: blur(100px);
            opacity: 0.2;
            pointer-events: none;
        }

        /* HEADER */
        .report-header {
            text-align: center;
            border-bottom: 1px solid var(--border-steel);
            padding-bottom: 2rem;
            margin-bottom: 2rem;
        }

        .h1-huge {
            font-family: var(--font-display);
            font-size: 3rem;
            line-height: 0.9;
            color: #fff;
            text-transform: uppercase;
        }

        .meta-line {
            color: #666;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            text-transform: uppercase;
        }

        /* SCORE GRID */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .metric-box {
            border: 1px solid var(--border-steel);
            padding: 1.5rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.01);
        }

        .metric-val {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: #fff;
            display: block;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .metric-label {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* AI FEEDBACK TERMINAL */
        .feedback-terminal {
            background: #000;
            border: 1px solid var(--border-steel);
            padding: 2rem;
            font-family: var(--font-tech);
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 2rem;
        }

        .term-header {
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            color: var(--signal-orange);
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .ai-markdown h1,
        .ai-markdown h2,
        .ai-markdown h3 {
            color: #fff;
            font-family: var(--font-display);
            margin: 1.5rem 0 0.5rem;
            font-weight: normal;
        }

        .ai-markdown p {
            margin-bottom: 1rem;
        }

        .ai-markdown strong {
            color: #fff;
        }

        .ai-markdown ul {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .ai-markdown code {
            background: #111;
            padding: 2px 4px;
            border: 1px solid #333;
            color: var(--success-green);
        }

        /* ACTIONS */
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-steel);
            color: #fff;
            padding: 1rem 2rem;
            font-family: var(--font-display);
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        .btn-primary {
            background: var(--signal-orange);
            color: #000;
            border-color: var(--signal-orange);
        }

        /* LOADING */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-concrete);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div class="report-container">

        <div class="glass-panel">
            <div class="decorative-blur"></div>

            <!-- Loading State -->
            <div id="loading-overlay">
                <div style="text-align: center;">
                    <div style="font-family: var(--font-display); font-size: 2rem; color: #fff; margin-bottom: 1rem;">
                        PROCESSING METRICS</div>
                    <div style="font-family: var(--font-tech); color: var(--signal-orange);">/// GENERATING REPORT</div>
                </div>
            </div>

            <!-- Content -->
            <div id="report-content" style="opacity: 0; transition: opacity 1s;">
                <header class="report-header">
                    <h1 class="h1-huge">Session<br>Debrief</h1>
                    <div class="meta-line">ID: <span th:text="${roundId}">000</span> // Status: COMPLETE</div>
                </header>

                <div class="metrics-grid">
                    <div class="metric-box">
                        <span class="metric-val" id="score-val">0</span>
                        <span class="metric-label">Correct Answers</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-val">10</span>
                        <span class="metric-label">Total Questions</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-val" id="accuracy-val" style="color: var(--success-green);">0%</span>
                        <span class="metric-label">Neural Accuracy</span>
                    </div>
                </div>

                <div class="feedback-terminal">
                    <div class="term-header">> AI_PERFORMANCE_ANALYSIS.LOG</div>
                    <div id="ai-output" class="ai-markdown">
                        [ SYSTEM LOG ] Analysis pending...
                    </div>
                </div>

                <div class="action-row">
                    <a href="#" onclick="window.location.href='/student/practice/dashboard?t=' + Date.now(); return false;" class="btn">Return to Base</a>
                    <a href="#" onclick="window.location.href='/student/practice/dashboard?t=' + Date.now(); return false;" class="btn btn-primary">New Session -></a>
                </div>
            </div>

        </div>

    </div>

    <script th:inline="javascript">
        const roundId = [[${ roundId }]];

        async function initReport() {
            try {
                const response = await fetch('/student/practice/api/round/end', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roundId: roundId })
                });

                const data = await response.json();

                if (data.success) {
                    // Update UI
                    document.getElementById('loading-overlay').style.display = 'none';
                    document.getElementById('report-content').style.opacity = '1';

                    document.getElementById('score-val').innerText = data.correctCount + "/10";
                    const acc = Math.round(data.accuracy * 100);
                    document.getElementById('accuracy-val').innerText = acc + '%';

                    if (acc < 50) document.getElementById('accuracy-val').style.color = 'var(--alert-red)';
                    else if (acc < 80) document.getElementById('accuracy-val').style.color = '#fff';

                    // AI Feedback
                    const rawMd = data.feedback || "Accessing feedback protocols... No data returned.";
                    document.getElementById('ai-output').innerHTML = marked.parse(rawMd);

                } else {
                    document.getElementById('loading-overlay').innerHTML = `<div style="color:red">ERROR LOADING REPORT: ${data.error}</div>`;
                }

            } catch (e) {
                console.error(e);
                document.getElementById('loading-overlay').innerHTML = `<div style="color:red">CONNECTION FAILURE</div>`;
            }
        }

        // Start
        setTimeout(initReport, 1000); // Small delay for effect
    </script>
</body>

</html>
