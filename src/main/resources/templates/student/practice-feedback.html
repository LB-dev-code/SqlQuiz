<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Performance - SqlQuiz</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            --morandi-blue: #a3b8c8;
            --morandi-rose: #d4a5a5;
            --morandi-green: #b5c4b1;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #475569;
            --accent: #7c9aaf;
            --accent-hover: #5d7e95;
            --success: #88a096;
            --danger: #c48b8b;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 40px 20px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 40px;
            text-align: center;
        }

        .result-icon {
            font-size: 64px;
            margin-bottom: 24px;
            color: var(--accent);
        }

        .score-display {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 10px;
        }

        .score-value {
            font-size: 72px;
            font-weight: 800;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-primary);
        }

        .score-total {
            font-size: 24px;
            color: var(--text-secondary);
        }

        .feedback-summary {
            font-size: 18px;
            margin-bottom: 32px;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
        }

        .stat-num {
            font-size: 24px;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
        }

        .ai-feedback-box {
            text-align: left;
            background: rgba(255, 255, 255, 0.2);
            padding: 24px;
            border-radius: var(--radius-md);
            margin-bottom: 40px;
            border: 1px solid var(--glass-border);
            max-height: 400px;
            overflow-y: auto;
        }

        .ai-feedback-box h3 {
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-content {
            font-size: 14px;
            line-height: 1.6;
        }

        .ai-content h2 {
            font-size: 18px;
            margin-top: 16px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .ai-content h3 {
            font-size: 16px;
            margin-top: 12px;
            margin-bottom: 6px;
            color: var(--accent);
        }

        .ai-content h4 {
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 4px;
            color: var(--accent);
        }

        .ai-content p {
            margin-bottom: 8px;
        }

        .ai-content ul, .ai-content ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .ai-content li {
            margin-bottom: 4px;
        }

        .ai-content strong {
            font-weight: 600;
            color: var(--text-primary);
        }

        .ai-content code {
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .action-btns {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            padding: 14px 32px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(124, 154, 175, 0.3);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #loading {
            font-size: 20px;
            opacity: 0.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .glass-card {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="glass-card">
            <div id="loading">Calculating your progress...</div>

            <div id="result-content" style="display: none;">
                <div class="result-icon"><i class="fas fa-trophy"></i></div>
                <h2 style="margin-bottom: 10px;">Round Completed</h2>

                <div class="score-display">
                    <span class="score-value" id="score-val">0</span>
                    <span class="score-total">/ 10</span>
                </div>

                <p class="feedback-summary" id="feedback-summary">Great job! You're making progress.</p>

                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-num" id="stat-accuracy">0%</span>
                        <span class="stat-label">Accuracy</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-num" id="stat-status">Completed</span>
                        <span class="stat-label">Status</span>
                    </div>
                </div>

                <div class="ai-feedback-box">
                    <h3><i class="fas fa-robot"></i> AI Performance Review</h3>
                    <div class="ai-content" id="ai-full-feedback">
                        Generating feedback...
                    </div>
                </div>

                <div class="action-btns">
                    <a href="/student/practice/dashboard" class="btn btn-outline">Back to Hub</a>
                    <a href="/student/practice/dashboard" class="btn btn-primary">Start Next Round <i
                            class="fas fa-arrow-right"></i></a>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const roundId = [[${ roundId }]];

        async function loadFeedback() {
            try {
                const response = await fetch('/student/practice/api/round/end', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roundId: roundId })
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('result-content').style.display = 'block';

                    document.getElementById('score-val').innerText = data.correctCount;
                    document.getElementById('stat-accuracy').innerText = Math.round(data.accuracy * 100) + '%';

                    // Format AI feedback (handle markdown-like blocks)
                    const feedback = data.feedback || "Round completed successfully. Accuracy: " + Math.round(data.accuracy * 100) + "%.";
                    // Parse markdown to HTML
                    const feedbackHtml = marked.parse(feedback);
                    document.getElementById('ai-full-feedback').innerHTML = feedbackHtml;

                    if (data.accuracy >= 0.9) {
                        document.getElementById('feedback-summary').innerText = "Exceptional performance! You've mastered these concepts.";
                        document.querySelector('.result-icon i').style.color = 'var(--morandi-green)';
                    } else if (data.accuracy >= 0.7) {
                        document.getElementById('feedback-summary').innerText = "Solid effort. Just a few more tweaks to reach mastery.";
                    } else {
                        document.getElementById('feedback-summary').innerText = "Keep going! Practice is the path to expertise.";
                        document.querySelector('.result-icon i').className = 'fas fa-rocket';
                    }
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerText = "Failed to load report. Please return to dashboard.";
            }
        }

        loadFeedback();
    </script>
</body>

</html>
