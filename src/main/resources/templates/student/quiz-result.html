<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol Status / Berlin Concrete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Berlin Concrete Palette */
            --bg-concrete: #141414;
            --surface-raw: rgba(255, 255, 255, 0.03);
            --glass-smoke: rgba(10, 10, 10, 0.6);
            --glass-frost: rgba(255, 255, 255, 0.02);
            --border-steel: rgba(255, 255, 255, 0.15);

            /* Accents */
            --signal-orange: #ff3c00;
            --blueprint-blue: #0044ff;
            --success-green: #00ff66;

            /* Typography */
            --font-display: 'Space Grotesk', sans-serif;
            --font-tech: 'IBM Plex Mono', monospace;

            /* Metrics */
            --space-unit: 1.5rem;
            --brutal-gap: 2px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-concrete);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            color: #e0e0e0;
            font-family: var(--font-tech);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-panel {
            background: var(--glass-smoke);
            backdrop-filter: blur(40px) saturate(120%);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-steel);
            width: 90%;
            max-width: 600px;
            padding: 2rem;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .result-panel::after {
            content: '';
            position: absolute;
            top: 2px;
            bottom: 2px;
            left: 2px;
            right: 2px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-steel);
            padding-bottom: 1.5rem;
        }

        .status-icon {
            font-size: 2.5rem;
            color: var(--success-green);
        }

        .status-title h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .status-meta {
            font-size: 0.8rem;
            color: #888;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .data-item {
            background: var(--surface-raw);
            padding: 1rem;
            border: 1px solid var(--border-steel);
        }

        .data-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .data-value {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: #fff;
        }

        .message-box {
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid rgba(0, 255, 102, 0.2);
            color: var(--success-green);
            padding: 1rem;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .action-bar {
            display: flex;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            background: transparent;
            border: 1px solid var(--border-steel);
            color: #fff;
            padding: 1rem;
            text-transform: uppercase;
            font-family: var(--font-tech);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:hover {
            background: #fff;
            color: #000;
        }

        .btn-primary {
            background: var(--blueprint-blue);
            border-color: var(--blueprint-blue);
        }

        .btn-primary:hover {
            background: #fff;
            color: var(--blueprint-blue);
        }
    </style>
</head>

<body>

    <div class="result-panel">
        <div class="status-header">
            <div class="status-icon">✓</div>
            <div class="status-title">
                <h1>Transmission<br>Complete</h1>
                <div class="status-meta">ID: <span th:text="${submission.id}">#8472</span> // SYNCED</div>
            </div>
        </div>

        <div class="data-grid">
            <div class="data-item">
                <div class="data-label">Module</div>
                <div class="data-value" th:text="${submission.quiz.title}"
                    style="font-size: 1rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;">SQL Basics
                </div>
            </div>
            <div class="data-item">
                <div class="data-label">Instructor</div>
                <div class="data-value" th:text="${submission.quiz.teacher.username}" style="font-size: 1rem;">Admin
                </div>
            </div>
            <div class="data-item">
                <div class="data-label">Start Time</div>
                <div class="data-value" th:text="${#temporals.format(submission.startTime, 'HH:mm:ss')}"
                    style="font-size: 1rem;">14:00</div>
            </div>
            <div class="data-item">
                <div class="data-label">End Time</div>
                <div class="data-value" th:text="${#temporals.format(submission.submitTime, 'HH:mm:ss')}"
                    style="font-size: 1rem;">14:45</div>
            </div>
            <div class="data-item">
                <div class="data-label">Time Elapsed</div>
                <div class="data-value" style="font-size: 1rem;">
                    <span th:if="${submission.timeSpent != null}" th:text="${submission.timeSpent + ' min'}">45
                        min</span>
                    <span th:if="${submission.timeSpent == null}">--</span>
                </div>
            </div>
            <div class="data-item">
                <div class="data-label">Payload Size</div>
                <div class="data-value" style="font-size: 1rem;">
                    <span th:text="${#lists.size(submission.questionAnswers)}">0</span> Blocks
                </div>
            </div>
        </div>

        <div class="message-box">
            > Data successfully archived. Pending instructor evaluation.
        </div>

        <div class="action-bar">
            <a href="/student/dashboard" class="btn">Return to Base</a>
            <a href="/student/submissions" class="btn btn-primary">View History</a>
        </div>
    </div>

</body>

</html>
