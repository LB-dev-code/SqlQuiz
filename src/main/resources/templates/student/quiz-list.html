<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Center / Berlin Concrete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@300;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Berlin Concrete Palette */
      --bg-concrete: #141414;
      --surface-raw: rgba(255, 255, 255, 0.03);
      --glass-smoke: rgba(10, 10, 10, 0.6);
      --glass-frost: rgba(255, 255, 255, 0.02);
      --border-steel: rgba(255, 255, 255, 0.15);

      /* Accents */
      --signal-orange: #ff3c00;
      --blueprint-blue: #0044ff;

      /* Typography */
      --font-display: 'Space Grotesk', sans-serif;
      --font-tech: 'IBM Plex Mono', monospace;

      /* Metrics */
      --space-unit: 1.5rem;
      --brutal-gap: 2px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-concrete);
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
      color: #e0e0e0;
      font-family: var(--font-tech);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Brutalist Layout Grid */
    .poster-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    /* SIDEBAR / NAVIGATION */
    .col-nav {
      background: var(--glass-smoke);
      backdrop-filter: blur(20px) grayscale(100%);
      border-right: 1px solid var(--border-steel);
      padding: var(--space-unit);
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-block h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 2rem;
      line-height: 0.9;
      text-transform: uppercase;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
    }

    .brand-meta {
      font-size: 0.7rem;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 4rem;
    }

    .nav-item {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: #888;
      text-decoration: none;
      transition: color 0.2s, padding-left 0.2s;
      position: relative;
    }

    .nav-item:hover,
    .nav-item.active {
      color: #fff;
      padding-left: 10px;
    }

    .nav-item.active::before {
      content: '→';
      position: absolute;
      left: -15px;
      color: var(--signal-orange);
    }

    .user-block {
      border-top: 1px solid var(--border-steel);
      padding-top: 1rem;
    }

    .user-avatar {
      font-size: 3rem;
      font-family: var(--font-display);
      line-height: 1;
      color: var(--signal-orange);
      margin-bottom: 0.5rem;
    }

    /* MAIN CONTENT AREA */
    .col-main {
      padding: 0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .manifesto-header {
      padding: calc(var(--space-unit) * 2);
      border-bottom: 1px solid var(--border-steel);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 2rem;
    }

    .header-title h2 {
      font-family: var(--font-display);
      font-size: 3rem;
      line-height: 0.9;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .header-meta {
      font-family: var(--font-tech);
      color: var(--signal-orange);
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    /* FILTERS & TOOLS */
    .filter-bar {
      border-bottom: 1px solid var(--border-steel);
      display: flex;
      flex-wrap: wrap;
    }

    .filter-item {
      padding: var(--space-unit);
      border-right: 1px solid var(--border-steel);
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
      min-width: 250px;
    }

    .raw-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #444;
      color: #fff;
      font-family: var(--font-tech);
      font-size: 1rem;
      padding: 0.5rem 0;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    .raw-input:focus {
      border-bottom-color: var(--signal-orange);
    }

    .raw-select {
      background: #111;
      border: 1px solid #333;
      color: #fff;
      padding: 0.5rem;
      font-family: var(--font-tech);
      outline: none;
      cursor: pointer;
    }

    .tab-group {
      display: flex;
      border-right: 1px solid var(--border-steel);
    }

    .tab-btn {
      padding: 0 var(--space-unit);
      background: transparent;
      border: none;
      border-right: 1px solid var(--border-steel);
      color: #666;
      font-family: var(--font-tech);
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.02);
    }

    .tab-btn.active {
      color: var(--signal-orange);
      background: rgba(255, 60, 0, 0.05);
    }

    /* QUIZ GRID */
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      border-bottom: 1px solid var(--border-steel);
    }

    .quiz-card {
      border-right: 1px solid var(--border-steel);
      border-bottom: 1px solid var(--border-steel);
      padding: var(--space-unit);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 300px;
      transition: background 0.2s;
      text-decoration: none;
      color: inherit;
      position: relative;
    }

    .quiz-card:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .quiz-card:hover .quiz-title {
      color: var(--signal-orange);
    }

    .card-header {
      margin-bottom: 2rem;
    }

    .quiz-status {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 1rem;
      display: inline-block;
      border: 1px solid #333;
      padding: 2px 6px;
    }

    .quiz-status.available {
      color: #46d39a;
      border-color: rgba(70, 211, 154, 0.3);
    }

    .quiz-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      line-height: 1.1;
      color: #fff;
      transition: color 0.2s;
    }

    .card-meta {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: #888;
      font-family: var(--font-tech);
      border-top: 1px solid #222;
      padding-top: 1rem;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
    }

    .start-indicator {
      margin-top: 1rem;
      text-align: right;
      color: var(--signal-orange);
      opacity: 0;
      transform: translateX(-10px);
      transition: all 0.2s;
    }

    .quiz-card:hover .start-indicator {
      opacity: 1;
      transform: translateX(0);
    }

    /* EMPTY STATE */
    .empty-state {
      padding: 4rem;
      text-align: center;
      opacity: 0.4;
      font-family: var(--font-tech);
      grid-column: 1 / -1;
    }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .poster-grid {
        grid-template-columns: 1fr;
      }

      .col-nav {
        height: auto;
        position: relative;
        flex-direction: row;
        align-items: center;
        border-bottom: 1px solid var(--border-steel);
        border-right: none;
      }

      .nav-menu {
        flex-direction: row;
        margin-top: 0;
        margin-left: auto;
      }

      .nav-item {
        font-size: 1rem;
      }

      .filter-bar {
        flex-direction: column;
      }

      .filter-item {
        border-right: none;
        border-bottom: 1px solid var(--border-steel);
      }
    }
  </style>
</head>

<body>

  <div class="poster-grid">

    <!-- COLUMN 1: NAVIGATION -->
    <aside class="col-nav">
      <div class="brand-block">
        <h1>Sql<br>Quiz<span style="color:var(--signal-orange)">.</span></h1>
      </div>

      <nav class="nav-menu">
        <a href="/student/dashboard" class="nav-item">Dashboard</a>
        <a href="/student/quizzes" class="nav-item active">Quiz List</a>
        <a href="/student/submissions" class="nav-item">History</a>
      </nav>

      <div class="user-block">
        <div class="user-avatar" th:text="${student != null ? #strings.substring(student.fullName, 0, 1) : 'G'}">G</div>
        <div style="font-size: 0.9rem; color: #fff;" th:text="${student != null ? student.fullName : 'Guest'}">Guest
          User</div>
        <a href="/logout"
          style="color: #666; text-decoration: none; font-size: 0.8rem; margin-top: 0.5rem; display: block;">›
          LOGOUT</a>
      </div>
    </aside>

    <!-- COLUMN 2: CONTENT -->
    <main class="col-main">

      <!-- PAGE HEADER -->
      <header class="manifesto-header">
        <div class="header-title">
          <div class="header-meta">/// SECTOR 01</div>
          <h2>Module<br>Directory</h2>
        </div>
        <div style="text-align: right; max-width: 300px; color: #888; font-size: 0.9rem;">
          Access all available assessments. Complete within designated time limits.
        </div>
      </header>

      <!-- TOOLBAR -->
      <div class="filter-bar">
        <div class="filter-item" style="flex: 2;">
          <span style="font-family: var(--font-tech); color: #666; font-size: 0.8rem;">SEARCH //</span>
          <input type="text" id="searchInput" class="raw-input" placeholder="ENTER KEYWORD...">
        </div>
        <div class="tab-group">
          <button class="tab-btn active" data-filter="all">ALL</button>
          <button class="tab-btn" data-filter="available">OPEN</button>
          <button class="tab-btn" data-filter="completed">CLOSED</button>
        </div>
      </div>

      <!-- GRID -->
      <div class="quiz-grid" id="quizContainer">

        <div th:if="${#lists.isEmpty(quizzes)}" class="empty-state">
          NO MODULES DETECTED
        </div>

        <a th:each="quiz : ${quizzes}" th:href="@{/student/quiz/{id}(id=${quiz.id})}" class="quiz-card"
          data-status="available">

          <div class="card-header">
            <div class="quiz-status available">AVAILABLE</div>
            <h3 class="quiz-title" th:text="${quiz.title}">Database Basics</h3>
          </div>

          <div class="card-meta">
            <div class="meta-row">
              <span>INSTRUCTOR</span>
              <span th:text="${quiz.teacher.fullName}">System</span>
            </div>
            <div class="meta-row">
              <span>TIME_LIMIT</span>
              <span th:text="${quiz.timeLimit != null ? quiz.timeLimit + ' MIN' : 'UNLIMITED'}">45 MIN</span>
            </div>
            <div class="meta-row">
              <span>ATTEMPTS</span>
              <span th:text="${quiz.maxAttempts != null ? quiz.maxAttempts : '∞'}">3</span>
            </div>
            <div class="start-indicator">
              INITIATE →
            </div>
          </div>
        </a>
      </div>

    </main>

  </div>

  <script th:inline="javascript">
    // Keep the filtering logic but adapt to new classes
    document.querySelectorAll('.tab-btn').forEach(tab => {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        this.classList.add('active');

        const filter = this.getAttribute('data-filter');
        const cards = document.querySelectorAll('.quiz-card');

        cards.forEach(card => {
          // Simple mock filtering logic - in real app, might need more complex status logic from Thymeleaf
          // ensuring we actually have data-status populated correctly
          if (filter === 'all' || card.getAttribute('data-status') === filter) {
            card.style.display = 'flex';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });

    document.getElementById('searchInput').addEventListener('input', function () {
      const term = this.value.toLowerCase();
      document.querySelectorAll('.quiz-card').forEach(card => {
        const title = card.querySelector('.quiz-title').textContent.toLowerCase();
        if (title.includes(term)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    });
  </script>

</body>

</html>
